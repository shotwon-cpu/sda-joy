<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세종 행복 안식일학교 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8fafc; font-family: 'Pretendard', sans-serif; }
    .nav-header { background-color: #312e81; }
    .verse-box { background-color: #1e1b4b; }
    .tab-active { background-color: #ef4444; color: white; border-color: #ef4444; }
    .tab-inactive { background-color: #f1f5f9; color: #475569; border-color: #cbd5e1; }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 -->
  <header class="nav-header text-white p-4 flex flex-col md:flex-row justify-between items-start md:items-center shadow-md gap-4">
    <div>
      <h1 class="text-xl md:text-2xl font-bold"><i class="fa-solid fa-book-bible mr-2"></i>세종 행복 안식일학교</h1>
      <p class="text-xs md:text-sm text-indigo-200 mt-1">기억절&교과방송 from 고은아빠</p>
    </div>
    <div class="flex items-center space-x-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
      <button onclick="goToCurrentWeek()" class="whitespace-nowrap bg-indigo-800 hover:bg-indigo-700 px-3 py-2 rounded-lg text-xs md:text-sm font-semibold transition">
        <i class="fa-solid fa-calendar-check mr-1"></i> 이번 주
      </button>
      <button onclick="openListModal('quarter')" class="whitespace-nowrap bg-emerald-600 hover:bg-emerald-500 px-3 py-2 rounded-lg text-xs md:text-sm font-semibold transition">
        <i class="fa-solid fa-layer-group mr-1"></i> 13기억절
      </button>
      <button onclick="openListModal('year')" class="whitespace-nowrap bg-amber-600 hover:bg-amber-500 px-3 py-2 rounded-lg text-xs md:text-sm font-semibold transition">
        <i class="fa-solid fa-list-ol mr-1"></i> 52기억절
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
    
    <!-- 주차 선택 컨트롤러 -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-2 w-full md:w-auto">
        <button onclick="changeWeek(-1)" class="w-10 h-10 rounded-full border hover:bg-slate-50 flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></button>
        <select id="weekSelector" onchange="selectWeek(this.value)" class="flex-1 md:w-64 border-slate-300 rounded-lg p-2 bg-slate-50 font-semibold focus:ring-indigo-500 text-center">
          <option value="">데이터를 불러오는 중...</option>
        </select>
        <button onclick="changeWeek(1)" class="w-10 h-10 rounded-full border hover:bg-slate-50 flex items-center justify-center"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>

    <!-- 로딩 화면 -->
    <div id="loading" class="text-center py-12 text-slate-500">
      <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
      <p>구글 시트에서 데이터를 불러오고 있습니다...</p>
    </div>

    <!-- 콘텐츠 영역 -->
    <div id="contentArea" class="hidden space-y-6">
      
      <!-- 기억절 카드 -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative">
        <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-50 rounded-bl-full -z-10"></div>
        <div class="p-6 md:p-8 relative z-10">
          <div class="flex justify-between items-start mb-4">
            <span id="displayQuarter" class="bg-yellow-100 text-yellow-800 text-xs font-bold px-3 py-1 rounded-full">제 ?기 ?과</span>
            <span id="displayDate" class="text-slate-400 text-sm"></span>
          </div>
          <h2 id="displayTitle" class="text-2xl md:text-3xl font-bold text-slate-800 mb-2 mt-4">제목을 불러오는 중</h2>
          <p id="displayBible" class="text-indigo-600 font-semibold text-lg mb-6">성경절 위치</p>
          
          <div class="verse-box text-white p-6 rounded-xl relative shadow-inner">
            <p id="displayVerse" class="text-lg md:text-xl leading-relaxed font-medium tracking-wide mb-4">
              "기억절 내용이 이곳에 표시됩니다."
            </p>
            
            <!-- 복사 & 읽기 편의 기능 버튼 -->
            <div class="flex justify-end space-x-2 pt-2 border-t border-indigo-900/50">
              <button onclick="speakVerse()" class="px-3 py-1.5 bg-indigo-950/80 hover:bg-indigo-900 rounded-lg text-xs text-indigo-200 transition flex items-center">
                <i class="fa-solid fa-volume-high mr-1.5"></i> 듣기
              </button>
              <button onclick="copyVerse()" class="px-3 py-1.5 bg-indigo-950/80 hover:bg-indigo-900 rounded-lg text-xs text-indigo-200 transition flex items-center">
                <i class="fa-solid fa-copy mr-1.5"></i> 복사
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 영상 카드 (3인 멀티탭 기능) -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-bold flex items-center text-slate-800">
            <i class="fa-brands fa-youtube text-red-500 mr-2 text-xl"></i> 이번 주 교과 해설 영상
          </h3>
        </div>

        <!-- 목사님 선택 탭 버튼 (a, b, c 로 통일) -->
        <div class="flex space-x-2 mb-4 overflow-x-auto pb-2">
          <button onclick="changeVideoTab('a')" id="tab-a" class="tab-active border px-4 py-2 rounded-lg font-bold text-sm whitespace-nowrap transition">강사 A</button>
          <button onclick="changeVideoTab('b')" id="tab-b" class="tab-inactive border px-4 py-2 rounded-lg font-bold text-sm whitespace-nowrap transition">강사 B</button>
          <button onclick="changeVideoTab('c')" id="tab-c" class="tab-inactive border px-4 py-2 rounded-lg font-bold text-sm whitespace-nowrap transition">강사 C</button>
        </div>

        <!-- 영상 플레이어 -->
        <div class="aspect-video bg-slate-900 rounded-xl overflow-hidden relative shadow-inner border border-slate-800">
          <iframe id="videoPlayer" class="w-full h-full hidden" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          <div id="noVideoMsg" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400">
            <i class="fa-regular fa-face-frown-open text-4xl mb-3"></i>
            <p>선택하신 강사님의 영상이 아직 준비되지 않았습니다.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 목록 보기 모달 -->
  <div id="verseListModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl p-5 md:p-6 w-full max-w-2xl shadow-2xl flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modalTitle" class="text-xl font-bold text-slate-800">목록</h3>
        <button onclick="closeListModal()" class="text-slate-400 hover:text-slate-700 transition">
          <i class="fa-solid fa-xmark text-2xl"></i>
        </button>
      </div>
      
      <div id="quarterSelectorContainer" class="mb-4 hidden">
        <select id="modalQuarterSelector" onchange="renderList('quarter', this.value)" class="w-full border-slate-300 rounded-lg p-2 bg-slate-50 font-semibold focus:ring-indigo-500">
        </select>
      </div>

      <div id="verseListContainer" class="overflow-y-auto flex-1 space-y-3 pr-2 custom-scrollbar">
      </div>
    </div>
  </div>

  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>

  <script>
    // 📢 [설정 구역] 여기서 강사 이름을 바꾸면 홈페이지 버튼 이름이 자동으로 바뀝니다!
    // 구글 시트의 youtube_a, youtube_b, youtube_c 헤더와 짝을 이룹니다.
    const TEACHER_NAMES = {
      a: "장석원 목사",
      b: "A 목사 해설",
      c: "B 목사 해설"
    };

    const API_URL = "https://script.google.com/macros/s/AKfycbyQTYzIeLdgZBizwLS2cgRAGbgRsko9KjpIBfc5vzp5r_2OPGa0t1nA8nKHcngonIWE/exec";
    
    let sheetData = [];
    let currentIndex = 0;
    let currentTab = 'a'; // 기본 선택 탭을 a로 변경

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    }

    window.onload = () => {
      // 탭 이름 셋팅
      document.getElementById('tab-a').innerText = TEACHER_NAMES.a;
      document.getElementById('tab-b').innerText = TEACHER_NAMES.b;
      document.getElementById('tab-c').innerText = TEACHER_NAMES.c;
      
      fetchData(API_URL);
    };

    async function fetchData(url) {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('contentArea').classList.add('hidden');
      
      try {
        const response = await fetch(url);
        const json = await response.json();
        
        if (json.status === 'success' && json.data.length > 0) {
          sheetData = json.data;
          buildWeekSelector();
          autoSelectCurrentWeek();
          updateUI();
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('contentArea').classList.remove('hidden');
        } else {
          alert("데이터를 찾을 수 없습니다. 시트 내용을 확인해주세요.");
        }
      } catch (e) {
        alert("데이터를 불러오는데 실패했습니다.");
        document.getElementById('loading').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-500 text-3xl mb-3"></i><p>데이터 로딩 오류</p>`;
      }
    }

    function autoSelectCurrentWeek() {
      const today = new Date();
      let closestIndex = 0;
      let minDiff = Infinity;

      sheetData.forEach((item, index) => {
        if (item.date) {
          const d = new Date(item.date);
          if (!isNaN(d)) {
            const diff = Math.abs(today - d);
            if (diff < minDiff) {
              minDiff = diff;
              closestIndex = index;
            }
          }
        }
      });
      currentIndex = closestIndex;
    }

    function goToCurrentWeek() {
      autoSelectCurrentWeek();
      updateUI();
    }

    function buildWeekSelector() {
      const selector = document.getElementById('weekSelector');
      selector.innerHTML = '';
      sheetData.forEach((item, index) => {
        let option = document.createElement('option');
        option.value = index;
        option.text = `${item.week || index+1}주차 (${item.quarter || ''})`;
        selector.appendChild(option);
      });
    }

    function updateUI() {
      if (sheetData.length === 0) return;
      const data = sheetData[currentIndex];

      document.getElementById('displayQuarter').innerText = data.quarter || '주차 정보 없음';
      
      let dateObj = data.date ? new Date(data.date) : null;
      document.getElementById('displayDate').innerText = dateObj && !isNaN(dateObj) ? 
        `${dateObj.getFullYear()}년 ${dateObj.getMonth()+1}월 ${dateObj.getDate()}일` : (data.date || '');

      document.getElementById('displayTitle').innerText = data.title_ko || '제목 없음';
      document.getElementById('displayBible').innerText = data.bible_ko || '';
      document.getElementById('displayVerse').innerText = data.verse_ko ? `"${data.verse_ko}"` : '기억절 내용이 없습니다.';
      
      document.getElementById('weekSelector').value = currentIndex;
      updateVideoPlayer();
    }

    function changeWeek(step) {
      let newIndex = currentIndex + step;
      if (newIndex >= 0 && newIndex < sheetData.length) {
        currentIndex = newIndex;
        updateUI();
      }
    }

    function selectWeek(index) {
      currentIndex = parseInt(index);
      updateUI();
    }

    function changeVideoTab(tabName) {
      currentTab = tabName;
      ['a', 'b', 'c'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if(t === tabName) {
          btn.className = "tab-active border px-4 py-2 rounded-lg font-bold text-sm whitespace-nowrap transition";
        } else {
          btn.className = "tab-inactive border px-4 py-2 rounded-lg font-bold text-sm whitespace-nowrap transition";
        }
      });
      updateVideoPlayer();
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function updateVideoPlayer() {
      const data = sheetData[currentIndex];
      const player = document.getElementById('videoPlayer');
      const noVideoMsg = document.getElementById('noVideoMsg');

      let targetUrl = '';
      // 👇 변경된 부분: 구글 시트의 youtube_a, youtube_b, youtube_c 데이터 연동
      if (currentTab === 'a') targetUrl = data.youtube_a;
      else if (currentTab === 'b') targetUrl = data.youtube_b;
      else if (currentTab === 'c') targetUrl = data.youtube_c;

      const videoId = extractYouTubeId(targetUrl);

      if (videoId) {
        player.src = `https://www.youtube.com/embed/${videoId}?rel=0`;
        player.classList.remove('hidden');
        noVideoMsg.classList.add('hidden');
      } else {
        player.src = "";
        player.classList.add('hidden');
        noVideoMsg.classList.remove('hidden');
      }
    }

    function copyVerse() {
      const data = sheetData[currentIndex];
      if (!data) return;
      const textToCopy = `[${data.quarter || ''}] ${data.title_ko || ''}\n📖 ${data.bible_ko || ''}\n\n"${data.verse_ko || ''}"`;
      navigator.clipboard.writeText(textToCopy).then(() => {
        alert('기억절이 클립보드에 복사되었습니다.');
      });
    }

    function speakVerse() {
      if (!('speechSynthesis' in window)) {
        alert("현재 접속하신 브라우저(카카오톡 등)에서는 듣기 기능을 지원하지 않습니다.\n화면 우측 하단 탭을 눌러 '다른 브라우저(사파리, 크롬)로 열기'를 선택해 주세요.");
        return;
      }

      const data = sheetData[currentIndex];
      if (!data || !data.verse_ko) return;
      
      window.speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(data.verse_ko);
      utterance.lang = 'ko-KR';
      utterance.rate = 0.85;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const koreanVoices = voices.filter(voice => voice.lang.includes('ko'));
      
      const googleVoice = koreanVoices.find(voice => voice.name.toLowerCase().includes('google') || voice.name.includes('구글'));
      if (googleVoice) {
        utterance.voice = googleVoice;
      } else if (koreanVoices.length > 0) {
        utterance.voice = koreanVoices[0];
      }

      window.speechSynthesis.speak(utterance);
    }

    function openListModal(mode) {
      if (sheetData.length === 0) return;
      
      const modal = document.getElementById('verseListModal');
      const title = document.getElementById('modalTitle');
      const qSelectorContainer = document.getElementById('quarterSelectorContainer');
      const qSelector = document.getElementById('modalQuarterSelector');
      
      modal.classList.remove('hidden');
      
      if (mode === 'quarter') {
        title.innerText = '13기억절 (분기별 보기)';
        qSelectorContainer.classList.remove('hidden');
        
        const currentQuarter = Math.floor(currentIndex / 13) + 1;
        const maxQuarter = Math.ceil(sheetData.length / 13) || 1;
        
        qSelector.innerHTML = '';
        for (let i = 1; i <= maxQuarter; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.text = `제 ${i}기 (${(i - 1) * 13 + 1}~${Math.min(i * 13, sheetData.length)}주차)`;
          if (i === currentQuarter) opt.selected = true;
          qSelector.appendChild(opt);
        }
        
        renderList('quarter', currentQuarter);
      } else {
        title.innerText = '52기억절 (1년 전체 보기)';
        qSelectorContainer.classList.add('hidden');
        renderList('year');
      }
    }

    function closeListModal() {
      document.getElementById('verseListModal').classList.add('hidden');
    }

    function renderList(mode, quarter = 1) {
      const container = document.getElementById('verseListContainer');
      container.innerHTML = '';
      
      let filteredData = [];
      if (mode === 'quarter') {
        const startIdx = (parseInt(quarter) - 1) * 13;
        const endIdx = startIdx + 13;
        filteredData = sheetData.slice(startIdx, endIdx).map((item, idx) => ({...item, originalIndex: startIdx + idx}));
      } else {
        filteredData = sheetData.map((item, idx) => ({...item, originalIndex: idx}));
      }
      
      if (filteredData.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-500 py-6">해당하는 기억절 데이터가 없습니다.</p>';
        return;
      }

      filteredData.forEach(item => {
        const div = document.createElement('div');
        const isCurrent = (item.originalIndex === currentIndex);
        div.className = `p-4 border rounded-xl cursor-pointer transition ${isCurrent ? 'bg-indigo-50 border-indigo-200' : 'bg-slate-50 hover:bg-slate-100 border-slate-200'}`;
        
        div.onclick = () => {
          selectWeek(item.originalIndex);
          closeListModal();
        };
        
        let dateObj = item.date ? new Date(item.date) : null;
        let dateStr = dateObj && !isNaN(dateObj) ? `${dateObj.getMonth()+1}월 ${dateObj.getDate()}일` : '';

        div.innerHTML = `
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold ${isCurrent ? 'text-indigo-700' : 'text-indigo-500'}">
              ${item.quarter || ((item.originalIndex + 1) + '주차')}
            </span>
            <span class="text-xs text-slate-400">${dateStr}</span>
          </div>
          <h4 class="font-bold text-slate-800 text-sm md:text-base mb-1">${item.title_ko || '제목 없음'}</h4>
          <p class="text-xs font-semibold text-slate-500 mb-1.5"><i class="fa-solid fa-book-open text-[10px] mr-1"></i>${item.bible_ko || ''}</p>
          <p class="text-sm text-slate-700 leading-relaxed font-medium">"${item.verse_ko || ''}"</p>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
