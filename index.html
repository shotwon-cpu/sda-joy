<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>세종 행복 교회</title>
  <style>
    :root {
      --primary-color: #272161;
      --secondary-color: #3b3582;
      --accent-yellow: #f8c226;
      --accent-blue: #3d70b2;
      --bg-light: #f7f8fa;
      --text-dark: #222;
      --text-gray: #666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    }

    body {
      background-color: #1a1a24;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 모바일 프레임 컨테이너 */
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    /* 상단 앱바 */
    .app-header {
      background-color: var(--primary-color);
      color: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
    }
    .app-header .title {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .app-header .header-icons {
      display: flex;
      gap: 8px;
    }
    .header-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    /* 본문 영역 */
    .app-content {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
      background-color: var(--bg-light);
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card-title {
      font-size: 15px;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 10px;
    }
    .verse-box {
      font-size: 15px;
      line-height: 1.6;
      color: #333;
      background-color: #f1f3f7;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .btn-open-bible {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .btn-open-bible:active {
      background-color: var(--secondary-color);
    }

    /* 하단 네비게이션 바 */
    .bottom-nav {
      height: 60px;
      background: #fff;
      border-top: 1px solid #e2e4e8;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      color: var(--text-gray);
      cursor: pointer;
      text-decoration: none;
    }
    .nav-item.active {
      color: var(--primary-color);
      font-weight: bold;
    }

    /* ================================================= */
    /* 성경 모달 레이어 (스크린샷 스타일 완벽 구현) */
    /* ================================================= */
    .bible-modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
      z-index: 1000;
    }
    .bible-modal-overlay.open {
      display: flex;
    }

    /* 모달 헤더 */
    .modal-header {
      background-color: var(--primary-color);
      color: white;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: bold;
      max-width: 50%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .modal-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-badge-yellow {
      background-color: var(--accent-yellow);
      color: #222;
      font-size: 11px;
      font-weight: bold;
      border: none;
      padding: 6px 9px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-badge-blue {
      background-color: #3b5998;
      color: white;
      font-size: 11px;
      font-weight: 500;
      border: none;
      padding: 6px 9px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .btn-modal-close {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
      margin-left: 4px;
      cursor: pointer;
      line-height: 1;
    }

    /* 모달 본문 (아이프레임 웹뷰) */
    .modal-body {
      flex: 1;
      background: #fff;
      position: relative;
    }
    .bible-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
    }

    /* 안내 하단 바 */
    .modal-footer-notice {
      background: #fafafa;
      border-top: 1px solid #eee;
      padding: 8px 12px;
      font-size: 11px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header class="app-header">
    <div class="title">
      <span>📖</span> 세종 행복 교회
    </div>
    <div class="header-icons">
      <button class="header-btn">🎵</button>
      <button class="header-btn">📅</button>
      <button class="header-btn">📚</button>
    </div>
  </header>

  <main class="app-content">
    <div class="card">
      <div class="card-title">오늘의 기억절</div>
      <div class="verse-box">
        <strong>고린도후서 2장 4절</strong><br/>
        "내가 마음에 큰 눌림과 걱정이 있어 많은 눈물로 너희에게 썼노니 이는 너희로 근심하게 하려 한 것이 아니요..."
      </div>
      <button class="btn-open-bible" onclick="openBibleModal('고후 2:4')">
        <span>📖</span> 고후 2:4 본문 보기
      </button>
    </div>

    <div class="card">
      <div class="card-title">성경 구절 바로가기 테스트</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="header-btn" style="background:#4a457a;" onclick="openBibleModal('창세기 1:1')">창세기 1:1</button>
        <button class="header-btn" style="background:#4a457a;" onclick="openBibleModal('마태복음 1:1')">마태복음 1:1</button>
        <button class="header-btn" style="background:#4a457a;" onclick="openBibleModal('요 3:16')">요한복음 3:16</button>
      </div>
    </div>
  </main>

  <footer class="bottom-nav">
    <div class="nav-item active">
      <span>📖</span>
      <span>성경</span>
    </div>
    <div class="nav-item">
      <span>⛪</span>
      <span>소모임</span>
    </div>
    <div class="nav-item">
      <span>🔍</span>
      <span>구절탐색</span>
    </div>
    <div class="nav-item">
      <span>👤</span>
      <span>MY</span>
    </div>
    <div class="nav-item">
      <span>☰</span>
      <span>메뉴</span>
    </div>
  </footer>

  <div id="bibleModal" class="bible-modal-overlay">
    <div class="modal-header">
      <div class="modal-title-wrap">
        <span>📖</span>
        <span id="bibleModalTitle">고후 2:4 본문 보기</span>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-badge-yellow" onclick="handleOpenExternal()">재림성경 앱</button>
        <button type="button" class="btn-badge-blue" onclick="handleOpenExternal()">⎘ 새창 열기</button>
        <button type="button" class="btn-modal-close" onclick="closeBibleModal()">✕</button>
      </div>
    </div>

    <div class="modal-body">
      <iframe id="bibleIframe" class="bible-iframe" src="about:blank"></iframe>
    </div>

    <div class="modal-footer-notice">
      💡 화면이 보이지 않으시면 상단의 <strong>[새창 열기]</strong> 또는 <strong>[재림성경 앱]</strong> 버튼을 눌러주세요.
    </div>
  </div>
</div>

<script>
  // =========================================================
  // 1. 시조사 성경 66권 전체 영문 코드 매핑 테이블
  // (book_idx=451 고정 규격 완벽 대응)
  // =========================================================
  const SIJOSA_BIBLE_CODE_MAP = {
    // 구약 39권
    "창": "Genesis", "창세기": "Genesis",
    "출": "Exodus", "출애굽기": "Exodus",
    "레": "Leviticus", "레위기": "Leviticus",
    "민": "Numbers", "민수기": "Numbers",
    "신": "Deuteronomy", "신명기": "Deuteronomy",
    "수": "Joshua", "여호수아": "Joshua",
    "삿": "Judges", "사사기": "Judges",
    "룻": "Ruth", "룻기": "Ruth",
    "삼상": "1 Samuel", "사무엘상": "1 Samuel",
    "삼하": "2 Samuel", "사무엘하": "2 Samuel",
    "왕상": "1 Kings", "열왕기상": "1 Kings",
    "왕하": "2 Kings", "열왕기하": "2 Kings",
    "대상": "1 Chronicles", "역대상": "1 Chronicles",
    "대하": "2 Chronicles", "역대하": "2 Chronicles",
    "스": "Ezra", "에스라": "Ezra",
    "느": "Nehemiah", "느헤미야": "Nehemiah",
    "에": "Esther", "에스더": "Esther",
    "욥": "Job", "욥기": "Job",
    "시": "Psalms", "시편": "Psalms",
    "잠": "Proverbs", "잠언": "Proverbs",
    "전": "Ecclesiastes", "전도서": "Ecclesiastes",
    "아": "Song of Songs", "아가": "Song of Songs",
    "사": "Isaiah", "이사야": "Isaiah",
    "렘": "Jeremiah", "예레미야": "Jeremiah",
    "애": "Lamentations", "예레미야애가": "Lamentations",
    "겔": "Ezekiel", "에스겔": "Ezekiel",
    "단": "Daniel", "다니엘": "Daniel",
    "호": "Hosea", "호세아": "Hosea",
    "욜": "Joel", "요엘": "Joel",
    "암": "Amos", "아모스": "Amos",
    "옵": "Obadiah", "오바댜": "Obadiah",
    "욘": "Jonah", "요나": "Jonah",
    "미": "Micah", "미가": "Micah",
    "나": "Nahum", "나훔": "Nahum",
    "합": "Habakkuk", "하박국": "Habakkuk",
    "습": "Zephaniah", "스바냐": "Zephaniah",
    "학": "Haggai", "학개": "Haggai",
    "슥": "Zechariah", "스가랴": "Zechariah",
    "말": "Malachi", "말라기": "Malachi",

    // 신약 27권
    "마": "Matthew", "마태복음": "Matthew",
    "막": "Mark", "마가복음": "Mark",
    "눅": "Luke", "누가복음": "Luke",
    "요": "John", "요한복음": "John",
    "행": "Acts", "사도행전": "Acts",
    "롬": "Romans", "로마서": "Romans",
    "고전": "1 Corinthians", "고린도전서": "1 Corinthians",
    "고후": "2 Corinthians", "고린도후서": "2 Corinthians",
    "갈": "Galatians", "갈라디아서": "Galatians",
    "엡": "Ephesians", "에베소서": "Ephesians",
    "빌": "Philippians", "빌립보서": "Philippians",
    "골": "Colossians", "골로새서": "Colossians",
    "살전": "1 Thessalonians", "데살로니가전서": "1 Thessalonians",
    "살후": "2 Thessalonians", "데살로니가후서": "2 Thessalonians",
    "딤전": "1 Timothy", "디모데전서": "1 Timothy",
    "딤후": "2 Timothy", "디모데후서": "2 Timothy",
    "딛": "Titus", "디도서": "Titus",
    "몬": "Philemon", "빌레몬서": "Philemon",
    "히": "Hebrews", "히브리서": "Hebrews",
    "약": "James", "야고보서": "James",
    "벧전": "1 Peter", "베드로전서": "1 Peter",
    "벧후": "2 Peter", "베드로후서": "2 Peter",
    "요일": "1 John", "요한일서": "1 John",
    "요이": "2 John", "요한이서": "2 John",
    "요삼": "3 John", "요한삼서": "3 John",
    "유": "Jude", "유다서": "Jude",
    "계": "Revelation", "요한계시록": "Revelation"
  };

  // 현재 열려 있는 시조사 URL 보관 변수
  let currentTargetBibleUrl = "";

  // =========================================================
  // 2. 구절 문자열 파싱 & 시조사 URL 생성 함수
  // =========================================================
  function parseBibleTextToUrl(bibleText) {
    // 한글명 + 장 + (선택)절 정규식 매칭
    const match = bibleText.trim().match(/^([가-힣]+)\s*(\d+)(?::(\d+))?/);
    
    if (!match) {
      console.error("올바르지 않은 구절 형식:", bibleText);
      return "https://www.sijosa.com/ch21/bible.php?book_idx=451";
    }

    const bookName = match[1];  // 예: 고후
    const chapter = match[2];   // 예: 2
    const verse = match[3] || 1; // 예: 4 (없으면 기본 1절)

    const code = SIJOSA_BIBLE_CODE_MAP[bookName];
    if (!code) {
      console.error("매핑되는 성경 코드가 없습니다:", bookName);
      return "https://www.sijosa.com/ch21/bible.php?book_idx=451";
    }

    // code 공백(%20) 인코딩 처리
    const encodedCode = encodeURIComponent(code);
    return `https://www.sijosa.com/ch21/bible.php?book_idx=451&code=${encodedCode}&chapter=${chapter}&verse=${verse}`;
  }

  // =========================================================
  // 3. 모달 제어 함수
  // =========================================================
  function openBibleModal(bibleText) {
    // 1. 정확한 URL 생성
    currentTargetBibleUrl = parseBibleTextToUrl(bibleText);

    // 2. 모달 타이틀 업데이트
    document.getElementById("bibleModalTitle").innerText = `${bibleText} 본문 보기`;

    // 3. iframe에 URL 주입
    document.getElementById("bibleIframe").src = currentTargetBibleUrl;

    // 4. 모달 열기
    document.getElementById("bibleModal").classList.add("open");
  }

  function closeBibleModal() {
    // iframe src 초기화 (메모리 해제 및 오디오 정지)
    document.getElementById("bibleIframe").src = "about:blank";
    document.getElementById("bibleModal").classList.remove("open");
  }

  // [재림성경 앱] 및 [새창 열기] 버튼 클릭 시 동작
  function handleOpenExternal() {
    if (currentTargetBibleUrl) {
      window.open(currentTargetBibleUrl, "_blank");
    }
  }
</script>
</body>
</html>
