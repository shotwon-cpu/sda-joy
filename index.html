<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>세종행복교회 안식일학교</title>
  
  <!-- PWA 메타태그 및 매니페스트 연결 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#312e81">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="세종행복교회">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3389/3389081.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    /* 카카오톡 인앱 브라우저 및 모바일/PC 전 기기 수직 스크롤 정상화 */
    html {
      width: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      font-family: 'Pretendard', sans-serif;
      overflow-x: hidden;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }

    .nav-header { background-color: #312e81; }
    .verse-box { background-color: #1e1b4b; }
    .tab-active { background-color: #ef4444; color: white; border-color: #ef4444; }
    .tab-inactive { background-color: #f1f5f9; color: #475569; border-color: #cbd5e1; }
    
    .swipe-area { 
      touch-action: pan-y !important; 
      user-select: none; 
      -webkit-user-select: none; 
    }
    
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #312e81; 
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="flex flex-col min-h-screen w-full">

  <!-- 상단 네비게이션 -->
  <header class="nav-header text-white px-3 py-3 md:px-6 md:py-4 flex justify-between items-center shadow-lg gap-2 sm:gap-4 overflow-hidden flex-shrink-0 w-full">
    <div class="flex flex-col justify-center min-w-0 flex-1 pr-1 sm:pr-2">
      <h1 class="text-[22px] sm:text-3xl md:text-4xl lg:text-5xl font-black flex items-center tracking-tight truncate">
        <i class="fa-solid fa-book-bible mr-1.5 sm:mr-3 text-[20px] sm:text-2xl md:text-3xl lg:text-4xl text-yellow-300"></i>세종 행복 교회
      </h1>
      <p class="text-[10px] sm:text-sm md:text-base lg:text-lg text-indigo-200 mt-1 md:mt-1.5 truncate pl-4">기억절 & 교과방송 by 고은아빠</p>
    </div>
    
    <!-- 찬미가 포함 4열 버튼 그리드 -->
    <div class="grid grid-cols-4 gap-1.5 sm:gap-2 md:gap-3 flex-shrink-0">
      <button onclick="openHymnModal()" class="w-full bg-rose-600 hover:bg-rose-500 px-1 sm:px-2 md:px-4 py-1.5 sm:py-2.5 rounded-lg text-[11px] sm:text-base md:text-lg font-extrabold transition shadow-md flex flex-col justify-center items-center text-white">
        <i class="fa-solid fa-music mb-1 text-sm sm:text-xl md:text-2xl"></i>
        <span class="whitespace-nowrap tracking-tight">찬미가</span>
      </button>

      <button onclick="goToCurrentWeek()" class="w-full bg-indigo-600 hover:bg-indigo-500 px-1 sm:px-2 md:px-4 py-1.5 sm:py-2.5 rounded-lg text-[11px] sm:text-base md:text-lg font-extrabold transition shadow-md flex flex-col justify-center items-center">
        <i class="fa-solid fa-calendar-check mb-1 text-sm sm:text-xl md:text-2xl"></i>
        <span class="whitespace-nowrap tracking-tight">이번 주</span>
      </button>

      <button onclick="openListModal('quarter')" class="w-full bg-emerald-600 hover:bg-emerald-500 px-1 sm:px-2 md:px-4 py-1.5 sm:py-2.5 rounded-lg text-[11px] sm:text-base md:text-lg font-extrabold transition shadow-md flex flex-col justify-center items-center">
        <i class="fa-solid fa-layer-group mb-1 text-sm sm:text-xl md:text-2xl"></i>
        <span class="whitespace-nowrap tracking-tight">13기억절</span>
      </button>

      <button onclick="openListModal('year')" class="w-full bg-amber-600 hover:bg-amber-500 px-1 sm:px-2 md:px-4 py-1.5 sm:py-2.5 rounded-lg text-[11px] sm:text-base md:text-lg font-extrabold transition shadow-md flex flex-col justify-center items-center">
        <i class="fa-solid fa-list-ol mb-1 text-sm sm:text-xl md:text-2xl"></i>
        <span class="whitespace-nowrap tracking-tight">52기억절</span>
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-2 md:p-4 space-y-3 md:space-y-5 mt-1 md:mt-2 relative flex-1 w-full pb-10">
    <div id="loadingScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-[#f8fafc] z-50">
      <div class="loader mb-4"></div>
      <p class="text-indigo-900 font-bold text-lg md:text-xl animate-pulse">데이터를 0.1초만에 불러옵니다 🚀</p>
      <p class="text-slate-500 text-sm mt-2">Firebase 초고속 서버 연동 완료</p>
    </div>

    <!-- 콘텐츠 영역 -->
    <div id="contentArea" class="hidden space-y-4 md:space-y-6 w-full">
      <div class="w-full overflow-hidden rounded-3xl">
        <div id="swipeZone" class="swipe-area bg-white rounded-3xl shadow-md border border-slate-200 overflow-hidden relative transition-transform duration-300 cursor-grab active:cursor-grabbing w-full">
          <div class="absolute top-0 right-0 w-40 h-40 bg-yellow-50 rounded-bl-full -z-10 opacity-70"></div>
          
          <div class="p-3.5 sm:p-5 md:p-8 relative z-10 pointer-events-none"> 
            
            <!-- 상단 컨트롤 바: [🔥 연속일수] + [◀] + [▶] + [제 ?기 ?과] -->
            <div class="mb-4 sm:mb-5 flex justify-end items-center gap-1.5 sm:gap-2 flex-wrap">
              <div id="streakBadge" class="pointer-events-auto flex items-center bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1.5 sm:py-2 rounded-full text-xs sm:text-sm font-black shadow-sm mr-auto sm:mr-0">
                <span class="mr-1 text-sm sm:text-base">🔥</span><span id="streakCount">0</span>일 연속
              </div>

              <button onclick="window.changeWeek(-1); event.stopPropagation();" class="pointer-events-auto w-10 h-10 sm:w-11 sm:h-11 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-full flex items-center justify-center transition shadow-sm border border-slate-200">
                <i class="fa-solid fa-chevron-left text-sm sm:text-base"></i>
              </button>
              <button onclick="window.changeWeek(1); event.stopPropagation();" class="pointer-events-auto w-10 h-10 sm:w-11 sm:h-11 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-full flex items-center justify-center transition shadow-sm border border-slate-200">
                <i class="fa-solid fa-chevron-right text-sm sm:text-base"></i>
              </button>
              <button onclick="window.openListModal('quarter'); event.stopPropagation();" class="pointer-events-auto bg-yellow-100 hover:bg-yellow-200 text-yellow-800 text-base sm:text-lg md:text-xl font-extrabold px-4 py-2 sm:px-5 sm:py-2.5 rounded-full transition shadow-sm inline-flex items-center ml-0.5 sm:ml-1">
                <span id="displayQuarter">제 ?기 ?과</span>
                <i class="fa-solid fa-caret-down ml-2 opacity-50 text-sm"></i>
              </button>
            </div>
            
            <div class="mb-4 sm:mb-6 flex flex-wrap items-baseline gap-x-3 gap-y-1">
              <h2 id="displayTitleKo" class="text-2xl md:text-3xl font-bold text-slate-800 leading-tight">제목을 불러오는 중</h2>
              <span id="displayTitleEn" class="text-base md:text-lg text-slate-400 font-medium italic"></span>
            </div>
            
            <div class="verse-box text-white px-2.5 py-4 sm:px-5 sm:py-6 md:p-10 rounded-2xl relative shadow-inner">
              <p class="leading-snug md:leading-relaxed font-semibold tracking-wide mb-4 sm:mb-5">
                <span id="displayVerseKo" class="transition-all duration-150"></span>
                <span id="displayBibleKo" class="font-medium text-indigo-300 ml-2 transition-all duration-150"></span>
              </p>
              <p class="leading-relaxed font-light text-indigo-200 italic mb-6 sm:mb-8">
                <span id="displayVerseEn" class="transition-all duration-150"></span>
                <span id="displayBibleEn" class="text-indigo-400/80 ml-2 font-normal transition-all duration-150"></span>
              </p>
              
              <!-- 7개 버튼 2행 레이아웃 (내부 여백 최소화 & 글씨 크기 극대화) -->
              <div class="pt-3 sm:pt-4 border-t border-indigo-900/60 pointer-events-auto relative z-20 space-y-2 sm:space-y-3">
                
                <!-- 1행 (3개 버튼) -->
                <div class="flex items-center justify-between gap-1 sm:gap-2 w-full flex-nowrap">
                  <!-- 1-1. 기억절 암송 완료 버튼 -->
                  <button id="btnReciteToggle" onclick="window.recordDailyRecite(); event.stopPropagation();" class="flex-1 px-1.5 py-2 sm:px-3 sm:py-2.5 rounded-lg text-sm sm:text-base md:text-lg font-black transition shadow-md flex items-center justify-center bg-indigo-950/80 hover:bg-indigo-900 text-indigo-200 border border-indigo-700/50 active:scale-95 whitespace-nowrap">
                    <i id="reciteIcon" class="fa-regular fa-circle-check mr-1 text-base sm:text-lg"></i>
                    <span id="reciteText" class="whitespace-nowrap font-black">오늘 암송 실천하기</span>
                  </button>

                  <!-- 1-2. 4단계 가림판 모드 버튼 -->
                  <button id="btnMaskStep" onclick="window.cycleMaskStep(); event.stopPropagation();" class="flex-1 px-1.5 py-2 sm:px-3 sm:py-2.5 rounded-lg text-sm sm:text-base md:text-lg font-black transition shadow-md flex items-center justify-center bg-indigo-900/90 hover:bg-indigo-800 text-amber-300 border border-amber-400/40 active:scale-95 whitespace-nowrap">
                    <i id="maskStepIcon" class="fa-regular fa-eye mr-1 text-base sm:text-lg text-amber-300"></i>
                    <span id="maskStepText" class="whitespace-nowrap font-black">1. 전체보기</span>
                  </button>

                  <!-- 1-3. 글씨 조절 버튼 -->
                  <div class="flex items-center space-x-0.5 bg-indigo-950/80 p-0.5 rounded-lg border border-indigo-900/80 flex-shrink-0">
                    <button onclick="window.adjustMainVerseTextSize(2); event.stopPropagation();" class="bg-indigo-900/80 hover:bg-indigo-800 text-indigo-100 font-black px-2 sm:px-3 py-1.5 rounded text-sm sm:text-base md:text-lg shadow-sm transition active:scale-95">A +</button>
                    <button onclick="window.adjustMainVerseTextSize(-2); event.stopPropagation();" class="bg-indigo-900/80 hover:bg-indigo-800 text-indigo-100 font-black px-2 sm:px-3 py-1.5 rounded text-sm sm:text-base md:text-lg shadow-sm transition active:scale-95">A -</button>
                  </div>
                </div>

                <!-- 2행 (4개 버튼) -->
                <div class="grid grid-cols-4 gap-1 sm:gap-2 w-full">
                  <button onclick="window.speakVerse('ko'); event.stopPropagation();" class="w-full py-2 sm:py-2.5 bg-indigo-950/80 hover:bg-indigo-900 rounded-lg text-sm sm:text-base md:text-lg font-black text-indigo-100 transition flex items-center justify-center shadow-sm tracking-tight whitespace-nowrap">
                    <i class="fa-solid fa-volume-high mr-1 text-sm sm:text-base"></i> 한글
                  </button>
                  <button onclick="window.speakVerse('en'); event.stopPropagation();" class="w-full py-2 sm:py-2.5 bg-indigo-950/80 hover:bg-indigo-900 rounded-lg text-sm sm:text-base md:text-lg font-black text-indigo-100 transition flex items-center justify-center shadow-sm tracking-tight whitespace-nowrap">
                    <i class="fa-solid fa-volume-high mr-1 text-sm sm:text-base text-blue-400"></i> 영어
                  </button>
                  <button onclick="window.copyVerse(); event.stopPropagation();" class="w-full py-2 sm:py-2.5 bg-indigo-950/80 hover:bg-indigo-900 rounded-lg text-sm sm:text-base md:text-lg font-black text-indigo-100 transition flex items-center justify-center shadow-sm tracking-tight whitespace-nowrap">
                    <i class="fa-solid fa-copy mr-1 text-sm sm:text-base"></i> 복사
                  </button>
                  <button onclick="window.shareVerse(); event.stopPropagation();" class="w-full py-2 sm:py-2.5 bg-indigo-950/80 hover:bg-indigo-900 rounded-lg text-sm sm:text-base md:text-lg font-black text-indigo-100 transition flex items-center justify-center shadow-sm tracking-tight whitespace-nowrap">
                    <i class="fa-solid fa-share-nodes mr-1 text-sm sm:text-base text-emerald-400"></i> 공유
                  </button>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 교과토의 자료 / 교과 열기 버튼 -->
      <div class="grid grid-cols-2 gap-2 sm:gap-3 my-3 sm:my-4">
        <a id="discussionBtn" onclick="openDiscussionModal(); return false;" href="#" class="flex items-center justify-center gap-2 py-3 px-2 sm:px-4 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-black rounded-2xl border border-emerald-100 transition shadow-sm text-base sm:text-lg md:text-xl opacity-50 pointer-events-none cursor-pointer">
          <i class="fa-solid fa-comments text-xl sm:text-2xl"></i>
          <span id="discussionBtnText">교과토의 준비중</span>
        </a>

        <a id="pdfLessonBtn" onclick="openPdfModal(); return false;" href="#" class="flex items-center justify-center gap-2 py-3 px-2 sm:px-4 bg-red-50 hover:bg-red-100 text-red-600 font-black rounded-2xl border border-red-100 transition shadow-sm text-base sm:text-lg md:text-xl opacity-50 pointer-events-none cursor-pointer">
          <i class="fa-solid fa-book-open-reader text-xl sm:text-2xl"></i>
          <span id="pdfBtnText">교과 준비중</span>
        </a>
      </div>

      <!-- 영상 카드 -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-6 md:pb-8">
        <div class="flex justify-between items-center mb-5 flex-wrap gap-2">
          <h3 class="text-xl md:text-2xl font-bold flex items-center text-slate-800">
            <i class="fa-brands fa-youtube text-red-500 mr-2 text-2xl"></i> 이번 주 교과 해설 영상
          </h3>
          <button id="videoNewTabBtn" onclick="openVideoNewTab()" class="text-sm md:text-base bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-lg font-bold transition flex items-center border border-red-200 shadow-sm opacity-50 pointer-events-none">
            <i class="fa-solid fa-arrow-up-right-from-square mr-1.5"></i> 새창/앱 열기
          </button>
        </div>
        <div class="flex space-x-2 mb-5 overflow-x-auto pb-2 custom-scrollbar">
          <button onclick="changeVideoTab('a')" id="tab-a" class="tab-active border px-5 py-2.5 rounded-lg font-bold text-base md:text-lg whitespace-nowrap transition shadow-sm">강사 A</button>
          <button onclick="changeVideoTab('b')" id="tab-b" class="tab-inactive border px-5 py-2.5 rounded-lg font-bold text-base md:text-lg whitespace-nowrap transition shadow-sm">강사 B</button>
          <button onclick="changeVideoTab('c')" id="tab-c" class="tab-inactive border px-5 py-2.5 rounded-lg font-bold text-base md:text-lg whitespace-nowrap transition shadow-sm">강사 C</button>
        </div>
        <div class="aspect-video bg-slate-900 rounded-2xl overflow-hidden relative shadow-inner border border-slate-800">
          <div id="videoLoader" class="absolute inset-0 flex items-center justify-center bg-slate-900 z-10 hidden">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-red-500"></i>
          </div>

          <div id="noVideoMsg" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-slate-900 p-4 text-center z-10 hidden">
            <i class="fa-brands fa-youtube text-5xl md:text-6xl text-slate-600 mb-3"></i>
            <p class="text-base md:text-lg font-bold text-slate-300">해당 강사의 교과 해설 영상 준비 중입니다.</p>
            <p class="text-xs md:text-sm text-slate-500 mt-1">다른 강사 탭을 선택해 영상을 확인해 보세요.</p>
          </div>

          <iframe id="videoPlayer" class="w-full h-full hidden transition-opacity duration-500 opacity-0" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>
    </div>
  </main>

  <!-- PWA 앱 원터치 설치 배너 -->
  <div id="pwaInstallBanner" class="hidden fixed bottom-3 left-3 right-3 max-w-md mx-auto bg-indigo-900/95 backdrop-blur-md text-white p-3.5 rounded-2xl shadow-2xl z-50 flex items-center justify-between border border-indigo-700 animate-fade-in">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-yellow-400 rounded-xl flex items-center justify-center text-indigo-950 font-black text-xl shadow">
        <i class="fa-solid fa-book-bible"></i>
      </div>
      <div>
        <p class="font-extrabold text-sm sm:text-base">세종행복교회 앱 설치</p>
        <p class="text-xs text-indigo-200">홈 화면에 추가하여 앱처럼 편리하게 이용하세요!</p>
      </div>
    </div>
    <div class="flex items-center space-x-1.5">
      <button id="btnPwaInstall" class="bg-yellow-400 hover:bg-yellow-300 text-indigo-950 font-black px-3 py-1.5 rounded-lg text-xs sm:text-sm shadow transition active:scale-95">설치</button>
      <button onclick="document.getElementById('pwaInstallBanner').classList.add('hidden')" class="text-indigo-300 hover:text-white p-1">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>
  </div>

  <!-- 찬미가 모달 -->
  <div id="hymnModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-[60] p-2 md:p-4">
    <div class="bg-white rounded-2xl w-full max-w-4xl h-[90vh] md:h-[85vh] flex flex-col overflow-hidden shadow-2xl animate-fade-in">
      <div class="bg-rose-800 text-white p-4 flex justify-between items-center">
        <h3 class="font-bold text-lg"><i class="fa-solid fa-music mr-2"></i>찬미가</h3>
        <div class="flex items-center space-x-3">
          <a href="https://www.adventist.or.kr/hymn/?referer=channel" target="_blank" class="text-rose-200 hover:text-white transition flex items-center text-sm bg-rose-700 px-3 py-1.5 rounded">
            <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> 새창 열기
          </a>
          <button onclick="closeHymnModal()" class="text-slate-300 hover:text-white transition p-1">
            <i class="fa-solid fa-xmark text-3xl"></i>
          </button>
        </div>
      </div>
      <div class="flex-1 w-full bg-slate-50 relative">
        <iframe id="hymnIframe" class="w-full h-full border-0" src=""></iframe>
      </div>
    </div>
  </div>

  <!-- 교과토의 모달 -->
  <div id="discussionModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-[60] p-2 md:p-4">
    <div class="bg-white rounded-2xl w-full max-w-4xl h-[90vh] md:h-[85vh] flex flex-col overflow-hidden shadow-2xl animate-fade-in">
      <div class="bg-slate-800 text-white p-4 flex justify-between items-center">
        <h3 id="discussionModalTitle" class="font-bold text-base sm:text-lg flex items-center truncate">
          <i class="fa-solid fa-comments mr-2"></i>이번 주 교과토의 자료
        </h3>
        <div class="flex items-center space-x-3">
          <button onclick="openDiscussionNewTab()" class="text-indigo-200 hover:text-white transition flex items-center text-sm bg-slate-700 px-3 py-1.5 rounded">
            <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> 새창 열기
          </button>
          <button onclick="closeDiscussionModal()" class="text-slate-300 hover:text-white transition p-1">
            <i class="fa-solid fa-xmark text-3xl"></i>
          </button>
        </div>
      </div>
      <div class="flex-1 w-full bg-slate-50 relative">
        <iframe id="discussionIframe" class="w-full h-full border-0 hidden" src=""></iframe>
        <div id="noDiscussionMsg" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-white hidden">
          <i class="fa-regular fa-folder-open text-6xl mb-4 text-slate-300"></i>
          <p class="text-lg">등록된 토의 자료 링크가 없습니다.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 교과 PDF, 이미지, 텍스트 하이브리드 모달 -->
  <div id="pdfModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-[70] p-2 md:p-4">
    <div class="bg-red-800 text-white p-3 md:p-4 flex justify-between items-center">
      <h3 id="modalHeaderTitle" class="font-bold text-base sm:text-lg flex items-center truncate">
        <i class="fa-solid fa-book-open mr-2"></i>이번 주 교과 자료
      </h3>
      
      <div class="flex items-center space-x-1.5 sm:space-x-2 flex-shrink-0">
        <button id="btnViewImage" onclick="window.switchModalView('image')" class="hidden bg-amber-300 hover:bg-amber-200 text-amber-900 px-2 sm:px-3 py-1.5 rounded-lg text-xs sm:text-sm font-black shadow-sm transition">
          <i class="fa-solid fa-images"></i> 이미지

        <button id="btnViewText" onclick="window.switchModalView('text')" class="hidden bg-blue-600 hover:bg-blue-500 text-white px-2 sm:px-3 py-1.5 rounded-lg text-xs sm:text-sm font-black shadow-sm transition">
          <i class="fa-solid fa-font"></i> 텍스트
        </button>

        <button onclick="window.openPdfSecured()" class="bg-red-700 hover:bg-red-600 text-red-100 px-2 sm:px-3 py-1.5 rounded-lg text-xs sm:text-sm font-black shadow-sm transition">
          <i class="fa-solid fa-file-pdf"></i> PDF새창

      <div id="textViewerContainer" class="hidden w-full h-full bg-[#fdfbf7] p-4 md:p-8 overflow-y-auto relative custom-scrollbar">
        <div class="sticky top-0 right-0 flex justify-end space-x-2 mb-4 z-10">
          <button onclick="window.adjustTextSize(2)" class="bg-white/80 backdrop-blur border border-slate-300 text-slate-700 px-3 py-1.5 rounded-lg font-black shadow-sm hover:bg-slate-100">A +</button>
          <button onclick="window.adjustTextSize(-2)" class="bg-white/80 backdrop-blur border border-slate-300 text-slate-700 px-3 py-1.5 rounded-lg font-black shadow-sm hover:bg-slate-100">A -</button>

    .slide-right { transform: translateX(100%); opacity: 0; }

  <!-- 목록 보기 모달 -->
  <div id="verseListModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-3 md:p-4">
    <div class="bg-white rounded-3xl p-5 md:p-8 w-full max-w-2xl shadow-2xl flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center mb-5">
        <h3 id="modalTitle" class="text-2xl font-bold text-slate-800">목록</h3>
        
        <div class="flex items-center space-x-2">
          <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
            <button onclick="window.adjustListTextSize(1)" class="bg-white hover:bg-slate-50 text-slate-700 font-extrabold px-2.5 py-1 rounded-lg text-xs sm:text-sm shadow-sm transition active:scale-95">A +</button>
            <button onclick="window.adjustListTextSize(-1)" class="bg-white hover:bg-slate-50 text-slate-700 font-extrabold px-2.5 py-1 rounded-lg text-xs sm:text-sm shadow-sm transition active:scale-95">A -</button>
          </div>
          <button onclick="closeListModal()" class="text-slate-400 hover:text-slate-700 transition p-1 ml-1">

          </button>

      <div id="quarterSelectorContainer" class="mb-5 hidden">
        <select id="modalQuarterSelector" onchange="renderList('quarter', this.value)" class="w-full border-slate-300 rounded-xl p-3 bg-slate-50 text-lg font-bold focus:ring-indigo-500">
        </select>
      </div>
      <div id="verseListContainer" class="overflow-y-auto flex-1 space-y-4 pr-2 custom-scrollbar">
      </div>
    </div>
  </div>

  <!-- 🚀 Firebase 연동 및 스크립트 영역 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      initializeFirestore, 
      persistentLocalCache, 
      persistentMultipleTabManager, 
      collection, 
      doc, 
      setDoc, 
      getDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBXM-QBYDZuOKpZXFXtwK5fpTGTL2uFHCE",
      authDomain: "sabbathschool-8586d.firebaseapp.com",
      projectId: "sabbathschool-8586d",
      storageBucket: "sabbathschool-8586d.appspot.com",
      messagingSenderId: "891053713701",
      appId: "1:891053713701:web:5e49997a29e1b5432852cc"
    };

    const app = initializeApp(firebaseConfig);

    // 💡 [2번 기능 핵심] IndexedDB 기반 Firestore 오프라인 영구 캐시 활성화
    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({
        tabManager: persistentMultipleTabManager()
      })
    });

    const auth = getAuth(app);

    window.DEFAULT_TEACHERS = { a: "장석원 목사", b: "권정행 목사", c: "이주환 목사" };
    window.sheetData = [];
    window.currentIndex = 0;
    window.currentTab = 'a';
    window.currentPdfUrl = ""; 
    window.currentModalMode = 'pdf';
    window.currentUser = null;

    window.currentMaskStep = 1;

    // 주차별 영구 암송 기록 (13기억절 모달 체크용)
    window.recitedWeeks = JSON.parse(localStorage.getItem('recited_weeks') || '{}');
    // 일일 연속 출석 기록 (매일 실천 스트릭용)
    window.streakData = JSON.parse(localStorage.getItem('streak_data') || '{"count": 0, "lastDate": ""}');

    // 한국 현지 날짜(YYYY-MM-DD) 반환 함수
    window.getTodayLocalDateString = function() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW registration failed:', err));
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('pwaInstallBanner');
      if (banner) banner.classList.remove('hidden');
    });

    document.getElementById('btnPwaInstall')?.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('pwaInstallBanner').classList.add('hidden');
        }
        deferredPrompt = null;
      }
    });

    window.onload = async () => {
      window.setupSwipeEvents(); 
      window.setupModalBackdropClicks();
      window.updateStreakUI();
      
      try {
        const userCred = await signInAnonymously(auth);
        window.currentUser = userCred.user;
        window.loadUserReciteDataFromCloud();

        const quarterDataRef = collection(db, 'sabbath_data');
        
        // 💡 오프라인 캐시가 적용되어 캐시된 로컬 DB로부터 0.01초만에 즉각 렌더링
        onSnapshot(quarterDataRef, (snapshot) => {
          let loadedData = [];
          
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            if (data && Array.isArray(data.lessons)) {
              loadedData = loadedData.concat(data.lessons);
            }
          });
          
          if (loadedData.length > 0) {
            loadedData.sort((a, b) => Number(a.week || a.index || 0) - Number(b.week || b.index || 0));
            window.sheetData = loadedData;
            
            if(window.currentIndex === 0) { window.autoSelectCurrentWeek(); }
            window.updateUI(true); 
            
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('contentArea').classList.remove('hidden');

            setTimeout(() => { window.updateVideoPlayer(); }, 100);
          } else {
            document.getElementById('loadingScreen').innerHTML = "<p class='text-amber-600 font-bold'>아직 최적화 수신 데이터가 준비되지 않았습니다.<br>구글 시트에서 [⚡ 최적화 데이터 전송]을 눌러주세요.</p>";
          }
        });

      } catch (error) {
        console.error("Auth/Firestore error:", error);
        // 오프라인 상태에서도 인증 실패 시 캐시된 LocalStorage 데이터가 동작하도록 대비
        document.getElementById('loadingScreen').innerHTML = "<p class='text-red-500 font-bold'>접속 권한(Auth) 오류입니다.</p>";
      }
    };

    window.cycleMaskStep = function() {
      window.currentMaskStep = (window.currentMaskStep % 4) + 1;
      window.applyVerseMasking();
    };

    window.applyVerseMasking = function() {
      const data = window.sheetData[window.currentIndex];
      if (!data) return;

      const btnText = document.getElementById('maskStepText');
      const btnIcon = document.getElementById('maskStepIcon');
      const verseKoElem = document.getElementById('displayVerseKo');
      const verseEnElem = document.getElementById('displayVerseEn');

      const originalKo = data.verse_ko ? data.verse_ko.trim() : "";
      const originalEn = data.verse_en ? data.verse_en.trim() : "";

      const stepNames = {
        1: { text: "1. 전체보기", icon: "fa-regular fa-eye" },
        2: { text: "2. 빈칸모드", icon: "fa-solid fa-puzzle-piece" },
        3: { text: "3. 첫글자만", icon: "fa-solid fa-font" },
        4: { text: "4. 전체가림", icon: "fa-solid fa-eye-slash" }
      };

      if (btnText && btnIcon) {
        btnText.innerText = stepNames[window.currentMaskStep].text;
        btnIcon.className = stepNames[window.currentMaskStep].icon + " mr-1 text-base sm:text-lg text-amber-300";
      }

      let maskedKo = originalKo;
      let maskedEn = originalEn;

      if (window.currentMaskStep === 2) {
        maskedKo = originalKo.split(' ').map((w, idx) => (w.length >= 3 && idx % 2 === 1) ? '[ ___ ]' : w).join(' ');
        maskedEn = originalEn.split(' ').map((w, idx) => (w.length >= 4 && idx % 2 === 1) ? '[ ___ ]' : w).join(' ');
      } else if (window.currentMaskStep === 3) {
        maskedKo = originalKo.split(' ').map(word => {
          if (word.length <= 1) return word;
          return word[0] + '○'.repeat(word.length - 1);
        }).join(' ');
        maskedEn = originalEn.split(' ').map(word => {
          if (word.length <= 1) return word;
          return word[0] + '•'.repeat(word.length - 1);
        }).join(' ');
      } else if (window.currentMaskStep === 4) {
        maskedKo = "••••••••••••••••••••••••••••••••••••••••";
        maskedEn = "••••••••••••••••••••••••••••••••••••••••";
      }

      if (verseKoElem) verseKoElem.innerText = maskedKo ? `"${maskedKo}"` : "";
      if (verseEnElem) verseEnElem.innerText = maskedEn ? `"${maskedEn}"` : "";
    };

    window.recordDailyRecite = async function() {
      const data = window.sheetData[window.currentIndex];
      if (!data) return;

      const todayStr = window.getTodayLocalDateString();
      const weekKey = String(data.week || (window.currentIndex + 1));

      window.recitedWeeks[weekKey] = true;
      localStorage.setItem('recited_weeks', JSON.stringify(window.recitedWeeks));

      if (window.streakData.lastDate === todayStr) {
        alert("오늘 암송 실천을 이미 완료하셨습니다! 🔥 (" + window.streakData.count + "일 연속 달성 중)");
        return;
      }

      if (window.streakData.lastDate) {
        const lastDateObj = new Date(window.streakData.lastDate + 'T00:00:00');
        const todayDateObj = new Date(todayStr + 'T00:00:00');
        const diffDays = Math.round((todayDateObj - lastDateObj) / (1000 * 60 * 60 * 24));

        if (diffDays === 1) {
          window.streakData.count = (window.streakData.count || 0) + 1;
        } else {
          window.streakData.count = 1;
        }
      } else {
        window.streakData.count = 1;
      }

      window.streakData.lastDate = todayStr;
      localStorage.setItem('streak_data', JSON.stringify(window.streakData));

      window.updateDailyReciteButtonUI(true);
      window.updateStreakUI();

      if (window.currentUser) {
        try {
          const userDocRef = doc(db, 'user_records', window.currentUser.uid);
          await setDoc(userDocRef, {
            recited_weeks: window.recitedWeeks,
            streak_data: window.streakData,
            last_updated: new Date().toISOString()
          }, { merge: true });
        } catch (e) {
          console.log("Cloud sync error:", e);
        }
      }
    };

    window.updateDailyReciteButtonUI = function(isDoneToday) {
      const btn = document.getElementById('btnReciteToggle');
      const icon = document.getElementById('reciteIcon');
      const text = document.getElementById('reciteText');
      if (!btn || !icon || !text) return;

      if (isDoneToday) {
        btn.className = "flex-1 px-1.5 py-2 sm:px-3 sm:py-2.5 rounded-lg text-sm sm:text-base md:text-lg font-black transition shadow-md flex items-center justify-center bg-emerald-600 hover:bg-emerald-500 text-white border border-emerald-400 active:scale-95 whitespace-nowrap";
        icon.className = "fa-solid fa-circle-check mr-1 text-base sm:text-lg text-yellow-300";
        text.innerText = "오늘 암송 완료! ✨";
      } else {
        btn.className = "flex-1 px-1.5 py-2 sm:px-3 sm:py-2.5 rounded-lg text-sm sm:text-base md:text-lg font-black transition shadow-md flex items-center justify-center bg-indigo-950/80 hover:bg-indigo-900 text-indigo-200 border border-indigo-700/50 active:scale-95 whitespace-nowrap";
        icon.className = "fa-regular fa-circle-check mr-1 text-base sm:text-lg";
        text.innerText = "오늘 암송 실천하기";
      }
    };

    window.updateStreakUI = function() {
      const streakElem = document.getElementById('streakCount');
      if (streakElem) {
        streakElem.innerText = window.streakData.count || 0;
      }
    };

    window.loadUserReciteDataFromCloud = async function() {
      if (!window.currentUser) return;
      try {
        const userDocRef = doc(db, 'user_records', window.currentUser.uid);
        const docSnap = await getDoc(userDocRef);
        if (docSnap.exists()) {
          const cloudData = docSnap.data();
          if (cloudData.recited_weeks) {
            window.recitedWeeks = { ...window.recitedWeeks, ...cloudData.recited_weeks };
            localStorage.setItem('recited_weeks', JSON.stringify(window.recitedWeeks));
          }
          if (cloudData.streak_data) {
            window.streakData = cloudData.streak_data;
            localStorage.setItem('streak_data', JSON.stringify(window.streakData));
            window.updateStreakUI();
          }
          const todayStr = window.getTodayLocalDateString();
          window.updateDailyReciteButtonUI(window.streakData.lastDate === todayStr);
        }
      } catch (e) {
        console.log("Cloud load failed:", e);
      }
    };
    
    window.getValidDate = function(dateVal) {
      if (!dateVal) return null;
      let d = new Date(dateVal);
      if (!isNaN(d)) return d;
      let fixedStr = String(dateVal).replace(/[\-\.]/g, '/').replace(/\s+/g, '');
      if(fixedStr.endsWith('/')) fixedStr = fixedStr.slice(0, -1);
      d = new Date(fixedStr);
      return isNaN(d) ? null : d;
    };

    window.autoSelectCurrentWeek = function() {
      const today = new Date();
      let closestIndex = 0, minDiff = Infinity;
      window.sheetData.forEach((item, index) => {
        const d = window.getValidDate(item.date);
        if (d) {
          const diff = Math.abs(today - d);
          if (diff < minDiff) { minDiff = diff; closestIndex = index; }
        }
      });
      window.currentIndex = closestIndex;
    };

    window.goToCurrentWeek = function() {
      window.autoSelectCurrentWeek();
      window.updateUI();
    };

    window.mainVerseFontDelta = 0;

    window.adjustMainVerseTextSize = function(delta) {
      window.mainVerseFontDelta += delta;
      if (window.mainVerseFontDelta < -6) window.mainVerseFontDelta = -6;
      if (window.mainVerseFontDelta > 16) window.mainVerseFontDelta = 16;
      window.applyMainVerseFontSize();
    };

    window.applyMainVerseFontSize = function() {
      const isMobile = window.innerWidth < 768;
      const baseKo = isMobile ? 24 : 30;
      const baseKoRef = isMobile ? 18 : 20;
      const baseEn = isMobile ? 18 : 20;
      const baseEnRef = isMobile ? 14 : 16;
      const d = window.mainVerseFontDelta || 0;

      const verseKoElem = document.getElementById('displayVerseKo');
      const bibleKoElem = document.getElementById('displayBibleKo');
      const verseEnElem = document.getElementById('displayVerseEn');
      const bibleEnElem = document.getElementById('displayBibleEn');

      if (verseKoElem) verseKoElem.style.fontSize = (baseKo + d) + 'px';
      if (bibleKoElem) bibleKoElem.style.fontSize = (baseKoRef + d) + 'px';
      if (verseEnElem) verseEnElem.style.fontSize = (baseEn + d) + 'px';
      if (bibleEnElem) bibleEnElem.style.fontSize = (baseEnRef + d) + 'px';
    };

    window.updateUI = function(skipVideo = false) {
      if (window.sheetData.length === 0) return;
      const data = window.sheetData[window.currentIndex];
      
      document.getElementById('displayQuarter').innerText = data.quarter || '정보 없음';
      document.getElementById('displayTitleKo').innerText = data.title_ko || '제목 없음';
      document.getElementById('displayTitleEn').innerText = data.title_en || '';
      
      const bibleKo = data.bible_ko ? `(${data.bible_ko})` : '';
      const bibleEn = data.bible_en ? `(${data.bible_en})` : '';
      
      document.getElementById('displayBibleKo').innerText = bibleKo;
      document.getElementById('displayBibleEn').innerText = bibleEn;
      
      window.applyVerseMasking();
      window.applyMainVerseFontSize();

      const todayStr = window.getTodayLocalDateString();
      window.updateDailyReciteButtonUI(window.streakData.lastDate === todayStr);

      const teacherA = (data && data.teacher_a && data.teacher_a.trim() !== '') ? data.teacher_a.trim() : window.DEFAULT_TEACHERS.a;
      const teacherB = (data && data.teacher_b && data.teacher_b.trim() !== '') ? data.teacher_b.trim() : window.DEFAULT_TEACHERS.b;
      const teacherC = (data && data.teacher_c && data.teacher_c.trim() !== '') ? data.teacher_c.trim() : window.DEFAULT_TEACHERS.c;

      const tabAElem = document.getElementById('tab-a');
      const tabBElem = document.getElementById('tab-b');
      const tabCElem = document.getElementById('tab-c');

      if (tabAElem) tabAElem.innerText = teacherA;
      if (tabBElem) tabBElem.innerText = teacherB;
      if (tabCElem) tabCElem.innerText = teacherC;

      const discBtn = document.getElementById('discussionBtn');
      const discBtnText = document.getElementById('discussionBtnText');
      const hasDiscussion = (data && data.discussion_link && data.discussion_link.trim() !== '');

      if (hasDiscussion) {
        discBtn.classList.remove('opacity-50', 'pointer-events-none');
        discBtnText.innerText = "교과토의 자료";
      } else {
        discBtn.classList.add('opacity-50', 'pointer-events-none');
        discBtnText.innerText = "교과토의 준비중";
      }

      const pdfBtn = document.getElementById('pdfLessonBtn');
      const pdfBtnText = document.getElementById('pdfBtnText');

      const hasText = (data && data.lesson_text && data.lesson_text.trim() !== '');
      const hasImage = (data && data.image_count && Number(data.image_count) > 0);
      const hasSourceUrl = (data && data.source_url && data.source_url.trim() !== '');
      const hasPdfUrl = (data && data.pdf_url && data.pdf_url.trim() !== '');

      if (hasText || hasImage || hasSourceUrl || hasPdfUrl) {
        window.currentPdfUrl = (hasSourceUrl ? data.source_url.trim() : (hasPdfUrl ? data.pdf_url.trim() : ""));
        pdfBtn.classList.remove('opacity-50', 'pointer-events-none');
        pdfBtnText.innerHTML = `교과 열기`;
      } else {
        window.currentPdfUrl = "";
        pdfBtn.classList.add('opacity-50', 'pointer-events-none');
        pdfBtnText.innerText = "교과 준비중";
      }
      
      if (!skipVideo) { window.updateVideoPlayer(); }
    };

    window.changeWeek = function(step) {
      let newIndex = window.currentIndex + step;
      if (newIndex >= 0 && newIndex < window.sheetData.length) { 
        const swipeZone = document.getElementById('swipeZone');
        if(step > 0) swipeZone.classList.add('slide-left');
        else swipeZone.classList.add('slide-right');

        setTimeout(() => {
          window.currentIndex = newIndex; 
          window.currentMaskStep = 1;
          window.updateUI();
          swipeZone.classList.remove('slide-left', 'slide-right');
          swipeZone.style.transition = 'none'; 
          if(step > 0) swipeZone.style.transform = 'translateX(100%)';
          else swipeZone.style.transform = 'translateX(-100%)';
          swipeZone.offsetHeight;
          setTimeout(() => {
            swipeZone.style.transition = 'transform 0.3s ease-out, opacity 0.3s ease-out';
            swipeZone.style.transform = 'translateX(0)';
            swipeZone.style.opacity = '1';
          }, 10);
        }, 200);
      }
    };
    
    window.selectWeek = function(index) { 
      window.currentIndex = parseInt(index); 
      window.currentMaskStep = 1; 
      window.updateUI(); 
    };

    window.extractYouTubeId = function(url) {
      if (!url) return null;
      const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/);
      return (match && match[2].length === 11) ? match[2] : null;
    };

    window.changeVideoTab = function(tabName) {
      if(window.currentTab === tabName) return; 
      window.currentTab = tabName;
      ['a', 'b', 'c'].forEach(t => {
        document.getElementById(`tab-${t}`).className = (t === tabName) ? "tab-active border px-5 py-2.5 rounded-lg font-bold text-base md:text-lg whitespace-nowrap transition shadow-sm" : "tab-inactive border px-5 py-2.5 rounded-lg font-bold text-base md:text-lg whitespace-nowrap transition shadow-sm";
      });
      window.updateVideoPlayer();
    };

    window.updateVideoPlayer = function() {
      const data = window.sheetData[window.currentIndex];
      const player = document.getElementById('videoPlayer');
      const loader = document.getElementById('videoLoader');
      const noVideoMsg = document.getElementById('noVideoMsg');
      const newTabBtn = document.getElementById('videoNewTabBtn');

      let targetUrl = (window.currentTab === 'a') ? data.youtube_a : (window.currentTab === 'b') ? data.youtube_b : data.youtube_c;
      const videoId = window.extractYouTubeId(targetUrl);
      
      if (videoId) {
        if (newTabBtn) newTabBtn.classList.remove('opacity-50', 'pointer-events-none');
        if (noVideoMsg) noVideoMsg.classList.add('hidden');
        
        player.classList.remove('opacity-100');
        player.classList.add('opacity-0');
        loader.classList.remove('hidden');
        
        setTimeout(() => {
          player.src = `https://www.youtube.com/embed/${videoId}?rel=0`;
          player.classList.remove('hidden');
          
          player.onload = () => {
            loader.classList.add('hidden');
            player.classList.remove('opacity-0');
            player.classList.add('opacity-100');
          };
        }, 200);
      } else {
        if (newTabBtn) newTabBtn.classList.add('opacity-50', 'pointer-events-none');
        player.src = "";
        player.classList.add('hidden');
        player.classList.remove('opacity-100');
        player.classList.add('opacity-0');
        loader.classList.add('hidden');
        if (noVideoMsg) noVideoMsg.classList.remove('hidden');
      }
    };

    window.openHymnModal = function() {
      const iframe = document.getElementById('hymnIframe');
      iframe.src = "https://www.adventist.or.kr/hymn/?referer=channel";
      document.getElementById('hymnModal').classList.remove('hidden');
    };

    window.closeHymnModal = function() {
      document.getElementById('hymnModal').classList.add('hidden');
      document.getElementById('hymnIframe').src = "";
    };

    window.openDiscussionModal = function() {
      const data = window.sheetData[window.currentIndex];
      const iframe = document.getElementById('discussionIframe');
      const noMsg = document.getElementById('noDiscussionMsg');
      const titleElem = document.getElementById('discussionModalTitle');

      if (titleElem && data && data.quarter) {
        titleElem.innerHTML = `<i class="fa-solid fa-comments mr-2"></i>${data.quarter} 토의 자료`;
      } else if (titleElem) {
        titleElem.innerHTML = `<i class="fa-solid fa-comments mr-2"></i>이번 주 교과토의 자료`;
      }

      if (data && data.discussion_link && data.discussion_link.trim() !== '') {
        iframe.src = data.discussion_link.trim();
        iframe.classList.remove('hidden');
        noMsg.classList.add('hidden');
      } else {
        iframe.src = "";
        iframe.classList.add('hidden');
        noMsg.classList.remove('hidden');
      }
      document.getElementById('discussionModal').classList.remove('hidden');
    };

    window.closeDiscussionModal = function() {
      document.getElementById('discussionModal').classList.add('hidden');
      document.getElementById('discussionIframe').src = "";
    };

    window.openDiscussionNewTab = function() {
      const data = window.sheetData[window.currentIndex];
      if (data && data.discussion_link && data.discussion_link.trim() !== '') {
        window.open(data.discussion_link.trim(), '_blank');
      } else {
        alert("등록된 교과토의 자료 링크가 없습니다.");
      }
    };

    window.currentTextSize = window.innerWidth < 768 ? 16 : 22;
    window.currentImagePage = 1;
    window.totalImagePages = 14;

    window.adjustTextSize = function(delta) {
      window.currentTextSize += delta;
      if(window.currentTextSize < 14) window.currentTextSize = 14;
      if(window.currentTextSize > 40) window.currentTextSize = 40;
      const area = document.getElementById('textContentArea');
      if (area) area.style.fontSize = window.currentTextSize + "px";
    };

    window.currentListTextDelta = 0;
    window.currentListMode = 'quarter';
    window.currentListQuarter = 1;

    window.adjustListTextSize = function(delta) {
      window.currentListTextDelta += delta;
      if (window.currentListTextDelta < -4) window.currentListTextDelta = -4;
      if (window.currentListTextDelta > 10) window.currentListTextDelta = 10;
      window.renderList(window.currentListMode, window.currentListQuarter);
    };

    window.openPdfModal = function() {
      const data = window.sheetData[window.currentIndex];
      const imgContainer = document.getElementById('imageViewerContainer');
      const textContainer = document.getElementById('textViewerContainer');
      const loading = document.getElementById('pdfLoadingMsg');
      
      const btnImage = document.getElementById('btnViewImage');
      const btnText = document.getElementById('btnViewText');
      
      const headerTitleElem = document.getElementById('modalHeaderTitle');
      if (headerTitleElem && data && data.quarter) {
         headerTitleElem.innerHTML = `<i class="fa-solid fa-book-open mr-2"></i>${data.quarter} 교과`;
      } else if (headerTitleElem) {
         headerTitleElem.innerHTML = `<i class="fa-solid fa-book-open mr-2"></i>이번 주 교과`;
      }

      imgContainer.innerHTML = '';
      document.getElementById('textContentArea').innerHTML = '';
      loading.classList.remove('hidden');
      document.getElementById('pdfModal').classList.remove('hidden');

      const hasText = (data && data.lesson_text && data.lesson_text.trim() !== '');
      const hasImage = (data && data.image_count && Number(data.image_count) > 0);

      if (btnImage) { if (hasImage) btnImage.classList.remove('hidden'); else btnImage.classList.add('hidden'); }
      if (btnText) { if (hasText) btnText.classList.remove('hidden'); else btnText.classList.add('hidden'); }

      if (hasText) {
        window.switchModalView('text');
      } else if (hasImage) {
        window.switchModalView('image');
      } else {
        loading.innerHTML = "<p class='text-slate-500 font-bold mt-4 text-center leading-relaxed'>등록된 교과 텍스트나 이미지가 없습니다.<br>상단 <span class='text-red-500'>[PDF새창]</span> 버튼을 눌러 원본을 확인하세요.</p>";
      }
    };

    window.switchModalView = function(mode) {
      const data = window.sheetData[window.currentIndex];
      const imgContainer = document.getElementById('imageViewerContainer');
      const textContainer = document.getElementById('textViewerContainer');
      const loading = document.getElementById('pdfLoadingMsg');
      
      imgContainer.classList.add('hidden');
      textContainer.classList.add('hidden');
      loading.classList.add('hidden');

      if (mode === 'text') {
        textContainer.classList.remove('hidden');
        const textContentArea = document.getElementById('textContentArea');
        textContentArea.style.whiteSpace = "pre-line";
        textContentArea.innerHTML = data.lesson_text || "";
        textContentArea.style.fontSize = window.currentTextSize + "px";
      } else if (mode === 'image') {
        imgContainer.classList.remove('hidden');
        window.currentImagePage = 1;
        window.totalImagePages = Number(data.image_count) || 14;
        window.renderImageSlider();
      }
    };

    window.renderImageSlider = function() {
      const imgContainer = document.getElementById('imageViewerContainer');
      imgContainer.innerHTML = `
        <div class="flex flex-col items-center justify-center w-full select-none" id="sliderWrapper">
          <div class="flex items-center justify-between w-full max-w-lg mb-3 px-2">
            <button onclick="window.changeImagePage(-1)" class="px-4 py-2 bg-slate-800 text-white rounded-lg font-bold text-sm shadow hover:bg-slate-700 active:scale-95 transition">◀ 이전</button>
            <span id="pageIndicator" class="font-bold text-slate-700 bg-slate-100 px-4 py-1.5 rounded-full text-sm border border-slate-200">
              ${window.currentImagePage} / ${window.totalImagePages}
            </span>
            <button onclick="window.changeImagePage(1)" class="px-4 py-2 bg-slate-800 text-white rounded-lg font-bold text-sm shadow hover:bg-slate-700 active:scale-95 transition">다음 ▶</button>
          </div>
          
          <div class="w-full flex justify-center relative min-h-[300px] items-center overflow-x-auto touch-pan-y" id="imgBoxArea">
            <img id="currentLessonImg" class="w-full max-w-2xl rounded-xl shadow-lg border border-slate-200 object-contain transition-opacity duration-200 block mx-auto" src="" alt="교과 이미지" />
          </div>
          
          <p class="text-xs text-slate-400 mt-2">💡 좌우로 시원하게 쓸어넘기거나 상단 버튼으로 페이지를 넘길 수 있습니다.</p>
        </div>
      `;

      window.loadImagePage(window.currentImagePage);
      window.attachSwipeEvents();
    };

    window.loadImagePage = function(page) {
      const data = window.sheetData[window.currentIndex];
      const weekNum = data.week || (window.currentIndex + 1);
      const bucketName = "sabbathschool-8586d.firebasestorage.app";
      const pageStr = String(page).padStart(2, '0');
      const imgUrl = `https://firebasestorage.googleapis.com/v0/b/${bucketName}/o/lessons%2Flesson_${weekNum}_${pageStr}.webp?alt=media`;

      const imgElem = document.getElementById('currentLessonImg');
      const indicator = document.getElementById('pageIndicator');

      if (imgElem) {
        imgElem.style.opacity = '0.3';
        imgElem.src = imgUrl;
        imgElem.onload = () => { imgElem.style.opacity = '1'; };
      }
      if (indicator) {
        indicator.innerText = `${page} / ${window.totalImagePages}`;
      }
    };

    window.changeImagePage = function(delta) {
      let newPage = window.currentImagePage + delta;
      if (newPage < 1) newPage = 1;
      if (newPage > window.totalImagePages) newPage = window.totalImagePages;

      if (newPage !== window.currentImagePage) {
        window.currentImagePage = newPage;
        window.loadImagePage(window.currentImagePage);
      }
    };

    window.attachSwipeEvents = function() {
      const wrapper = document.getElementById('imgBoxArea');
      if (!wrapper) return;

      let startX = 0;
      let startY = 0;
      let isMultiTouch = false;

      wrapper.addEventListener('touchstart', (e) => {
        if (e.touches.length > 1) {
          isMultiTouch = true;
          return;
        }
        isMultiTouch = false;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      wrapper.addEventListener('touchmove', (e) => {
        if (e.touches.length > 1) {
          isMultiTouch = true;
        }
      }, { passive: true });

      wrapper.addEventListener('touchend', (e) => {
        if (isMultiTouch) return;

        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;

        const diffX = endX - startX;
        const diffY = endY - startY;

        if (Math.abs(diffX) > 70 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
          if (diffX < 0) {
            window.changeImagePage(1);  
          } else {
            window.changeImagePage(-1); 
          }
        }
      }, { passive: true });
    };

    window.closePdfModal = function() {
      document.getElementById('pdfModal').classList.add('hidden');
      document.getElementById('imageViewerContainer').innerHTML = "";
      document.getElementById('textContentArea').innerHTML = "";
      document.getElementById('imageViewerContainer').classList.add('hidden');
      document.getElementById('textViewerContainer').classList.add('hidden');
      document.getElementById('pdfLoadingMsg').classList.remove('hidden');
    };

    window.openPdfSecured = function() {
      const data = window.sheetData[window.currentIndex];
      let targetUrl = (data && data.source_url && data.source_url.trim() !== '') 
                      ? data.source_url.trim() 
                      : (data && data.pdf_url && data.pdf_url.trim() !== '') 
                        ? data.pdf_url.trim() 
                        : window.currentPdfUrl;
      if (!targetUrl) {
        alert("❌ 연결할 원본 PDF 주소가 없습니다.");
        return;
      }
      
      let gviewUrl = "https://docs.google.com/gview?url=" + encodeURIComponent(targetUrl);
      window.open(gviewUrl, '_blank');
    };

    window.openVideoNewTab = function() {
      const data = window.sheetData[window.currentIndex];
      let targetUrl = (window.currentTab === 'a') ? data.youtube_a : (window.currentTab === 'b') ? data.youtube_b : data.youtube_c;
      const videoId = window.extractYouTubeId(targetUrl);
      if (videoId) {
        window.open(`https://www.youtube.com/watch?v=${videoId}`, '_blank');
      } else {
        alert("현재 선택된 강사의 영상 링크가 없습니다.");
      }
    };

    window.copyVerse = function() {
      const data = window.sheetData[window.currentIndex];
      if (!data) return;
      const textToCopy = `[${data.quarter || ''}]\nKR: ${data.title_ko || ''}\nEN: ${data.title_en || ''}\n\n📖 ${data.bible_ko || ''} / ${data.bible_en || ''}\n"${data.verse_ko || ''}"\n"${data.verse_en || ''}"`;
      navigator.clipboard.writeText(textToCopy).then(() => { alert('기억절이 클립보드에 복사되었습니다.'); });
    };

    window.shareVerse = function() {
      const data = window.sheetData[window.currentIndex];
      if (!data) return;
      const textToShare = `[${data.quarter || ''}]\nKR: ${data.title_ko || ''}\nEN: ${data.title_en || ''}\n\n📖 ${data.bible_ko || ''} / ${data.bible_en || ''}\n"${data.verse_ko || ''}"\n"${data.verse_en || ''}"`;
      if (navigator.share) {
        navigator.share({ title: '세종행복교회 안식일학교', text: textToShare }).catch(console.error);
      } else {
        navigator.clipboard.writeText(textToShare).then(() => { alert('기억절이 클립보드에 복사되었습니다.'); });
      }
    };

    window.speakVerse = function(lang) {
      if (!('speechSynthesis' in window)) { alert("현재 브라우저에서는 듣기 기능을 지원하지 않습니다."); return; }
      const data = window.sheetData[window.currentIndex];
      if (!data) return;
      const textToSpeak = lang === 'en' ? data.verse_en : data.verse_ko;
      if (!textToSpeak) { alert(lang === 'en' ? "영어 기억절이 없습니다." : "한글 기억절이 없습니다."); return; }
      
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.rate = 0.85; utterance.pitch = 1.0;
      const voices = window.speechSynthesis.getVoices();
      
      if (lang === 'en') {
        utterance.lang = 'en-US';
        const googleVoice = voices.find(v => v.name.toLowerCase().includes('google') && v.lang.startsWith('en'));
        if (googleVoice) utterance.voice = googleVoice;
      } else {
        utterance.lang = 'ko-KR';
        const googleVoice = voices.find(v => (v.name.toLowerCase().includes('google') || v.name.includes('구글')) && v.lang.includes('ko'));
        if (googleVoice) utterance.voice = googleVoice;
      }
      window.speechSynthesis.speak(utterance);
    };

    window.openListModal = function(mode) {
      if (window.sheetData.length === 0) return;
      const modal = document.getElementById('verseListModal');
      const qSelectorContainer = document.getElementById('quarterSelectorContainer');
      const qSelector = document.getElementById('modalQuarterSelector');
      modal.classList.remove('hidden');
      
      window.currentListMode = mode;

      if (mode === 'quarter') {
        document.getElementById('modalTitle').innerText = '13기억절 (분기별 보기)';
        qSelectorContainer.classList.remove('hidden');
        const currentQuarter = Math.floor(window.currentIndex / 13) + 1;
        const maxQuarter = Math.ceil(window.sheetData.length / 13) || 1;
        qSelector.innerHTML = '';
        for (let i = 1; i <= maxQuarter; i++) {
          let opt = document.createElement('option');
          opt.value = i; opt.text = `제 ${i}기 (${(i - 1) * 13 + 1}~${Math.min(i * 13, window.sheetData.length)}주차)`;
          if (i === currentQuarter) opt.selected = true;
          qSelector.appendChild(opt);
        }
        window.currentListQuarter = currentQuarter;
        window.renderList('quarter', currentQuarter);
      } else {
        document.getElementById('modalTitle').innerText = '52기억절 (1년 보기)';
        qSelectorContainer.classList.add('hidden');
        window.renderList('year');
      }
    };

    window.closeListModal = function() {
      document.getElementById('verseListModal').classList.add('hidden');
    };

    window.renderList = function(mode, quarter = 1) {
      window.currentListMode = mode;
      window.currentListQuarter = quarter;

      const container = document.getElementById('verseListContainer');
      container.innerHTML = '';
      let filteredData = (mode === 'quarter') ? 
        window.sheetData.slice((parseInt(quarter) - 1) * 13, (parseInt(quarter) - 1) * 13 + 13).map((item, idx) => ({...item, originalIndex: (parseInt(quarter) - 1) * 13 + idx})) : 
        window.sheetData.map((item, idx) => ({...item, originalIndex: idx}));
      
      if (filteredData.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-500 py-5 text-lg">해당하는 데이터가 없습니다.</p>'; return;
      }

      const d = window.currentListTextDelta || 0;
      const titleKoSize = (20 + d) + "px";
      const titleEnSize = (14 + d) + "px";
      const bibleSize = (16 + d) + "px";
      const verseKoSize = (18 + d) + "px";
      const verseEnSize = (15 + d) + "px";

      filteredData.forEach(item => {
        const div = document.createElement('div');
        const isCurrent = (item.originalIndex === window.currentIndex);
        const itemWeekKey = String(item.week || (item.originalIndex + 1));
        const isRecited = !!window.recitedWeeks[itemWeekKey];

        div.className = `p-5 border rounded-2xl cursor-pointer transition relative ${isCurrent ? 'bg-indigo-50 border-indigo-200 shadow-md' : 'bg-slate-50 hover:bg-slate-100 border-slate-200'}`;
        div.onclick = () => { window.selectWeek(item.originalIndex); window.closeListModal(); };
        
        let dObj = window.getValidDate(item.date);
        let dateStr = '';
        if(dObj){
          const month = dObj.getMonth()+1;
          const date = dObj.getDate();
          dateStr = `${month}월 ${date}일`;
        }

        const checkBadgeHtml = isRecited ? `
          <span class="inline-flex items-center gap-1 bg-emerald-100 text-emerald-800 text-xs font-black px-2.5 py-1 rounded-full border border-emerald-200 shadow-sm ml-2">
            <i class="fa-solid fa-check text-emerald-600"></i> 암송완료
          </span>
        ` : '';
        
        div.innerHTML = `
          <div class="flex justify-between items-center mb-2">
            <div class="flex items-center">
              <span class="text-sm font-bold ${isCurrent ? 'text-indigo-700' : 'text-indigo-500'}">${item.quarter || ((item.originalIndex + 1) + '주차')}</span>
              ${checkBadgeHtml}
            </div>
            <span class="text-sm text-slate-400">${dateStr}</span>
          </div>
          <h4 class="font-bold text-slate-800 leading-snug" style="font-size: ${titleKoSize};">${item.title_ko || '제목 없음'}</h4>
          <p class="text-slate-400 mb-3 italic" style="font-size: ${titleEnSize};">${item.title_en || ''}</p>
          <p class="font-semibold text-slate-500 mb-2" style="font-size: ${bibleSize};"><i class="fa-solid fa-book-open text-sm mr-1.5"></i>${item.bible_ko || ''} <span class="font-normal text-slate-400">/ ${item.bible_en || ''}</span></p>
          <p class="text-slate-800 leading-relaxed font-medium mt-1" style="font-size: ${verseKoSize};">"${item.verse_ko || ''}"</p>
          <p class="text-slate-500 leading-relaxed font-light italic mt-2" style="font-size: ${verseEnSize};">"${item.verse_en || ''}"</p>
        `;
        container.appendChild(div);
      });
    };

    window.setupSwipeEvents = function() {
      const swipeZone = document.getElementById('swipeZone');
      let touchStartX = 0, touchStartY = 0;
      const minSwipeDistance = 45; 

      swipeZone.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].clientX; 
        touchStartY = e.changedTouches[0].clientY; 
      }, {passive: true});
      
      swipeZone.addEventListener('touchend', e => {
        let touchEndX = e.changedTouches[0].clientX; 
        let touchEndY = e.changedTouches[0].clientY; 
        let dx = touchEndX - touchStartX; 
        let dy = touchEndY - touchStartY; 
        
        if (Math.abs(dx) >= minSwipeDistance && Math.abs(dx) > Math.abs(dy) * 1.5) {
           if (dx > 0) window.changeWeek(-1); 
           else window.changeWeek(1);  
        }
      }, {passive: true});

      let isMouseDown = false;
      swipeZone.addEventListener('mousedown', e => { isMouseDown = true; touchStartX = e.clientX; touchStartY = e.clientY; });
      swipeZone.addEventListener('mouseup', e => {
        if(isMouseDown) {
          isMouseDown = false;
          let dx = e.clientX - touchStartX; let dy = e.clientY - touchStartY;
          if (Math.abs(dx) >= minSwipeDistance && Math.abs(dx) > Math.abs(dy) * 1.5) {
             if (dx > 0) window.changeWeek(-1); else window.changeWeek(1); 
          }
        }
      });
      swipeZone.addEventListener('mouseleave', () => { isMouseDown = false; });
    };

    window.setupModalBackdropClicks = function() {
      const modals = [
        { id: 'hymnModal', closeFunc: window.closeHymnModal },
        { id: 'discussionModal', closeFunc: window.closeDiscussionModal },
        { id: 'pdfModal', closeFunc: window.closePdfModal },
        { id: 'verseListModal', closeFunc: window.closeListModal }
      ];

      modals.forEach(modalInfo => {
        const modalElement = document.getElementById(modalInfo.id);
        if (modalElement) {
          modalElement.addEventListener('click', function(e) {
            if (e.target === this) {
              modalInfo.closeFunc();
            }
          });
        }
      });
    };
  </script>
