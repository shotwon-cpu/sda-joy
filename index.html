<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세종행복교회 안식일학교</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8fafc; font-family: 'Pretendard', sans-serif; overflow-x: hidden; }
    .nav-header { background-color: #312e81; }
    .verse-box { background-color: #1e1b4b; }
    .tab-active { background-color: #ef4444; color: white; border-color: #ef4444; }
    .tab-inactive { background-color: #f1f5f9; color: #475569; border-color: #cbd5e1; }
    .swipe-area { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 -->
  <header class="nav-header text-white px-4 py-3 md:px-6 md:py-4 flex justify-between items-center shadow-lg gap-3">
    <div class="min-w-0 flex-shrink">
      <h1 class="text-base sm:text-lg md:text-2xl font-black flex items-center tracking-tight">
        <i class="fa-solid fa-book-bible mr-2 text-sm sm:text-base md:text-xl text-yellow-300"></i>세종행복교회
      </h1>
      <p class="text-[10px] sm:text-[12px] md:text-sm text-indigo-200 mt-1 truncate">기억절 & 교과방송 from 고은아빠</p>
    </div>
    <div class="flex items-center space-x-2 sm:space-x-3 md:space-x-4 flex-shrink-0">
      <button onclick="goToCurrentWeek()" class="whitespace-nowrap bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-[11px] sm:text-sm md:text-base font-bold transition shadow-md">
        <i class="fa-solid fa-calendar-check mr-1 hidden sm:inline"></i>이번 주
      </button>
      <button onclick="openListModal('quarter')" class="whitespace-nowrap bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-[11px] sm:text-sm md:text-base font-bold transition shadow-md">
        <i class="fa-solid fa-layer-group mr-1 hidden sm:inline"></i>13기억절
      </button>
      <button onclick="openListModal('year')" class="whitespace-nowrap bg-amber-600 hover:bg-amber-500 px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-[11px] sm:text-sm md:text-base font-bold transition shadow-md">
        <i class="fa-solid fa-list-ol mr-1 hidden sm:inline"></i>52기억절
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-3 md:p-5 space-y-4 md:space-y-6 mt-2">
    
    <!-- 콘텐츠 영역 -->
    <div id="contentArea" class="hidden space-y-4 md:space-y-6">
      
      <!-- 기억절 카드 (스와이프 영역) -->
      <div id="swipeZone" class="swipe-area bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden relative transition-transform duration-300 cursor-grab active:cursor-grabbing">
        <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-50 rounded-bl-full -z-10 opacity-70"></div>
        <div class="p-5 md:p-8 relative z-10 pointer-events-none"> 
          
          <div class="flex justify-between items-center mb-4">
            <!-- 기존 주차 선택 드롭다운 대신, 이 버튼을 누르면 13기억절 목록창이 열리도록 변경 -->
            <button onclick="openListModal('quarter'); event.stopPropagation();" class="pointer-events-auto bg-yellow-100 hover:bg-yellow-200 text-yellow-800 text-xs md:text-sm font-bold px-4 py-1.5 rounded-full transition shadow-sm flex items-center">
              <span id="displayQuarter">제 ?기 ?과</span>
              <i class="fa-solid fa-caret-down ml-2 opacity-50"></i>
            </button>
            <span id="displayDate" class="text-slate-500 text-xs md:text-sm font-medium"></span>
          </div>
          
          <!-- 제목 영역 -->
          <div class="mb-4">
            <h2 class="text-2xl md:text-3xl font-bold text-slate-800 leading-tight inline-block mr-3">
              <span id="displayTitleKo">제목을 불러오는 중</span>
            </h2>
            <span id="displayTitleEn" class="text-base md:text-lg text-slate-400 font-medium inline-block align-bottom pb-1"></span>
          </div>
          
          <!-- 성경절 위치 -->
          <p class="text-indigo-600 font-semibold text-lg md:text-xl mb-5">
            <span id="displayBibleKo"></span>
            <span id="displayBibleEn" class="text-sm md:text-base text-indigo-400 ml-2 font-normal"></span>
          </p>
          
          <div class="verse-box text-white p-6 md:p-8 rounded-2xl relative shadow-inner">
            <p id="displayVerseKo" class="text-2xl md:text-3xl leading-snug font-semibold tracking-wide mb-4"></p>
            <p id="displayVerseEn" class="text-lg md:text-xl leading-relaxed font-light text-indigo-200 italic mb-6"></p>
            
            <div class="flex justify-end space-x-2 pt-4 border-t border-indigo-900/60 pointer-events-auto relative z-20">
              <button onclick="speakVerse('ko'); event.stopPropagation();" class="px-3.5 py-2 bg-indigo-950/80 hover:bg-indigo-900 rounded-lg text-xs md:text-sm text-indigo-200 transition flex items-center shadow-sm">
                <i class="fa-solid fa-volume-high mr-1.5"></i> 한글
              </button>
              <button onclick="speakVerse('en'); event.stopPropagation();" class="px-3.5 py-2 bg-indigo-950/80 hover:bg-indigo-900 rounded-lg text-xs md:text-sm text-indigo-200 transition flex items-center shadow-sm">
                <i class="fa-solid fa-volume-high mr-1.5 text-blue-400"></i> 영어
              </button>
              <button onclick="copyVerse(); event.stopPropagation();" class="px-3.5 py-2 bg-indigo-950/80 hover:bg-indigo-900 rounded-lg text-xs md:text-sm text-indigo-200 transition flex items-center shadow-sm">
                <i class="fa-solid fa-copy mr-1.5"></i> 복사
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 교과토의 자료 링크 카드 -->
      <div onclick="openDiscussionModal()" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-5 flex justify-between items-center cursor-pointer hover:bg-slate-50 transition active:bg-slate-100">
        <div class="flex items-center">
          <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-emerald-50 border border-emerald-100 flex items-center justify-center text-emerald-600 mr-4">
            <i class="fa-solid fa-comments text-lg md:text-xl"></i>
          </div>
          <div>
            <h3 class="font-bold text-slate-800 text-base md:text-lg">교과토의 자료 보기</h3>
            <p class="text-xs md:text-sm text-slate-500 mt-0.5">이번 주 토의 자료를 확인하세요</p>
          </div>
        </div>
        <div class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-50">
          <i class="fa-solid fa-chevron-right text-slate-400 text-sm md:text-base"></i>
        </div>
      </div>

      <!-- 영상 카드 -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg md:text-xl font-bold flex items-center text-slate-800">
            <i class="fa-brands fa-youtube text-red-500 mr-2"></i> 이번 주 교과 해설 영상
          </h3>
        </div>

        <div class="flex space-x-2 mb-4 overflow-x-auto pb-1 custom-scrollbar">
          <button onclick="changeVideoTab('a')" id="tab-a" class="tab-active border px-4 py-2 rounded-lg font-bold text-sm md:text-base whitespace-nowrap transition">강사 A</button>
          <button onclick="changeVideoTab('b')" id="tab-b" class="tab-inactive border px-4 py-2 rounded-lg font-bold text-sm md:text-base whitespace-nowrap transition">강사 B</button>
          <button onclick="changeVideoTab('c')" id="tab-c" class="tab-inactive border px-4 py-2 rounded-lg font-bold text-sm md:text-base whitespace-nowrap transition">강사 C</button>
        </div>

        <div class="aspect-video bg-slate-900 rounded-xl overflow-hidden relative shadow-inner border border-slate-800">
          <iframe id="videoPlayer" class="w-full h-full hidden" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>
    </div>
  </main>

  <!-- 교과토의 자료 모달창 -->
  <div id="discussionModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-[60] p-2 md:p-4">
    <div class="bg-white rounded-xl w-full max-w-4xl h-[90vh] md:h-[85vh] flex flex-col overflow-hidden shadow-2xl animate-fade-in">
      
      <div class="bg-slate-800 text-white p-3 md:p-4 flex justify-between items-center">
        <h3 class="font-bold text-base md:text-lg"><i class="fa-solid fa-comments mr-2"></i>이번 주 교과토의 자료</h3>
        <div class="flex items-center space-x-3">
          <button onclick="openDiscussionNewTab()" class="text-indigo-200 hover:text-white transition flex items-center text-sm bg-slate-700 px-3 py-1.5 rounded">
            <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> 새창 열기
          </button>
          <button onclick="closeDiscussionModal()" class="text-slate-300 hover:text-white transition p-1">
            <i class="fa-solid fa-xmark text-2xl"></i>
          </button>
        </div>
      </div>
      
      <div class="flex-1 w-full bg-slate-50 relative">
        <iframe id="discussionIframe" class="w-full h-full border-0 hidden" src=""></iframe>
        <div id="noDiscussionMsg" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-white hidden">
          <i class="fa-regular fa-folder-open text-5xl mb-4 text-slate-300"></i>
          <p class="text-base">등록된 토의 자료 링크가 없습니다.</p>
        </div>
      </div>

    </div>
  </div>

  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .animate-fade-in { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    
    /* 스와이프 애니메이션용 클래스 */
    .slide-left { transform: translateX(-100%); opacity: 0; }
    .slide-right { transform: translateX(100%); opacity: 0; }
  </style>

  <!-- 목록 보기 모달 -->
  <div id="verseListModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-3 md:p-4">
    <div class="bg-white rounded-2xl p-4 md:p-6 w-full max-w-2xl shadow-2xl flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modalTitle" class="text-xl md:text-2xl font-bold text-slate-800">목록</h3>
        <button onclick="closeListModal()" class="text-slate-400 hover:text-slate-700 transition">
          <i class="fa-solid fa-xmark text-2xl"></i>
        </button>
      </div>
      
      <div id="quarterSelectorContainer" class="mb-4 hidden">
        <select id="modalQuarterSelector" onchange="renderList('quarter', this.value)" class="w-full border-slate-300 rounded-lg p-2.5 bg-slate-50 text-base font-semibold focus:ring-indigo-500">
        </select>
      </div>

      <div id="verseListContainer" class="overflow-y-auto flex-1 space-y-3 pr-2 custom-scrollbar">
      </div>
    </div>
  </div>

  <script>
    const TEACHER_NAMES = { a: "장석원 목사", b: "A 목사 해설", c: "B 목사 해설" };
    const API_URL = "https://script.google.com/macros/s/AKfycbyQTYzIeLdgZBizwLS2cgRAGbgRsko9KjpIBfc5vzp5r_2OPGa0t1nA8nKHcngonIWE/exec";
    
    let sheetData = [];
    let currentIndex = 0;
    let currentTab = 'a';

    window.onload = () => {
      document.getElementById('tab-a').innerText = TEACHER_NAMES.a;
      document.getElementById('tab-b').innerText = TEACHER_NAMES.b;
      document.getElementById('tab-c').innerText = TEACHER_NAMES.c;
      fetchData(API_URL);
      setupSwipeEvents(); 
    };

    async function fetchData(url) {
      document.getElementById('contentArea').classList.add('hidden');
      try {
        const response = await fetch(url);
        const json = await response.json();
        if (json.status === 'success' && json.data.length > 0) {
          sheetData = json.data;
          autoSelectCurrentWeek();
          updateUI();
          document.getElementById('contentArea').classList.remove('hidden');
        }
      } catch (e) {
        alert("데이터 로딩 오류");
      }
    }

    function autoSelectCurrentWeek() {
      const today = new Date();
      let closestIndex = 0, minDiff = Infinity;
      sheetData.forEach((item, index) => {
        if (item.date) {
          const d = new Date(item.date);
          if (!isNaN(d)) {
            const diff = Math.abs(today - d);
            if (diff < minDiff) { minDiff = diff; closestIndex = index; }
          }
        }
      });
      currentIndex = closestIndex;
    }

    function goToCurrentWeek() {
      autoSelectCurrentWeek();
      updateUI();
    }

    function updateUI() {
      if (sheetData.length === 0) return;
      const data = sheetData[currentIndex];
      
      // 노란색 딱지에 정보 표시
      document.getElementById('displayQuarter').innerText = data.quarter || '정보 없음';
      
      let dObj = data.date ? new Date(data.date) : null;
      let dateObjString = '';
      if(dObj && !isNaN(dObj)){
        const month = dObj.getMonth()+1;
        const date = dObj.getDate();
        dateObjString = `${dObj.getFullYear()}년 ${month}월 ${date}일`;
      }
      document.getElementById('displayDate').innerText = dateObjString || (data.date||'');
      document.getElementById('displayTitleKo').innerText = data.title_ko || '제목 없음';
      document.getElementById('displayTitleEn').innerText = data.title_en || '';
      document.getElementById('displayBibleKo').innerText = data.bible_ko || '';
      document.getElementById('displayBibleEn').innerText = data.bible_en || '';
      document.getElementById('displayVerseKo').innerText = data.verse_ko ? `"${data.verse_ko}"` : '';
      document.getElementById('displayVerseEn').innerText = data.verse_en ? `"${data.verse_en}"` : '';
      
      updateVideoPlayer();
    }

    function changeWeek(step) {
      let newIndex = currentIndex + step;
      if (newIndex >= 0 && newIndex < sheetData.length) { 
        const swipeZone = document.getElementById('swipeZone');
        
        if(step > 0) swipeZone.classList.add('slide-left');
        else swipeZone.classList.add('slide-right');

        setTimeout(() => {
          currentIndex = newIndex; 
          updateUI();
          
          swipeZone.classList.remove('slide-left', 'slide-right');
          swipeZone.style.transition = 'none'; 
          
          if(step > 0) swipeZone.style.transform = 'translateX(100%)';
          else swipeZone.style.transform = 'translateX(-100%)';
          
          setTimeout(() => {
            swipeZone.style.transition = 'transform 0.3s ease-out, opacity 0.3s ease-out';
            swipeZone.style.transform = 'translateX(0)';
            swipeZone.style.opacity = '1';
          }, 10);

        }, 200);
      }
    }
    
    function selectWeek(index) { 
      currentIndex = parseInt(index); 
      updateUI(); 
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function changeVideoTab(tabName) {
      currentTab = tabName;
      ['a', 'b', 'c'].forEach(t => {
        document.getElementById(`tab-${t}`).className = (t === tabName) ? "tab-active border px-4 py-2 rounded-lg font-bold text-sm md:text-base whitespace-nowrap transition" : "tab-inactive border px-4 py-2 rounded-lg font-bold text-sm md:text-base whitespace-nowrap transition";
      });
      updateVideoPlayer();
    }

    function updateVideoPlayer() {
      const data = sheetData[currentIndex];
      const player = document.getElementById('videoPlayer');
      let targetUrl = (currentTab === 'a') ? data.youtube_a : (currentTab === 'b') ? data.youtube_b : data.youtube_c;
      const videoId = extractYouTubeId(targetUrl);
      if (videoId) {
        player.src = `https://www.youtube.com/embed/${videoId}?rel=0`;
        player.classList.remove('hidden');
      } else {
        player.src = "";
        player.classList.add('hidden');
      }
    }

    function openDiscussionModal() {
      const data = sheetData[currentIndex];
      const iframe = document.getElementById('discussionIframe');
      const noMsg = document.getElementById('noDiscussionMsg');

      if (data && data.discussion_link && data.discussion_link.trim() !== '') {
        iframe.src = data.discussion_link.trim();
        iframe.classList.remove('hidden');
        noMsg.classList.add('hidden');
      } else {
        iframe.src = "";
        iframe.classList.add('hidden');
        noMsg.classList.remove('hidden');
      }
      document.getElementById('discussionModal').classList.remove('hidden');
    }

    function closeDiscussionModal() {
      document.getElementById('discussionModal').classList.add('hidden');
      document.getElementById('discussionIframe').src = "";
    }

    function openDiscussionNewTab() {
      const data = sheetData[currentIndex];
      if (data && data.discussion_link && data.discussion_link.trim() !== '') {
        window.open(data.discussion_link.trim(), '_blank');
      } else {
        alert("등록된 교과토의 자료 링크가 없습니다.");
      }
    }

    function copyVerse() {
      const data = sheetData[currentIndex];
      if (!data) return;
      const textToCopy = `[${data.quarter || ''}]\nKR: ${data.title_ko || ''}\nEN: ${data.title_en || ''}\n\n📖 ${data.bible_ko || ''} / ${data.bible_en || ''}\n"${data.verse_ko || ''}"\n"${data.verse_en || ''}"`;
      navigator.clipboard.writeText(textToCopy).then(() => { alert('기억절이 클립보드에 복사되었습니다.'); });
    }

    function speakVerse(lang) {
      if (!('speechSynthesis' in window)) {
        alert("현재 브라우저에서는 듣기 기능을 지원하지 않습니다.");
        return;
      }
      const data = sheetData[currentIndex];
      if (!data) return;
      const textToSpeak = lang === 'en' ? data.verse_en : data.verse_ko;
      if (!textToSpeak) {
        alert(lang === 'en' ? "영어 기억절이 없습니다." : "한글 기억절이 없습니다.");
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.rate = 0.85; utterance.pitch = 1.0;
      const voices = window.speechSynthesis.getVoices();
      
      if (lang === 'en') {
        utterance.lang = 'en-US';
        const englishVoices = voices.filter(voice => voice.lang.startsWith('en'));
        const googleVoice = englishVoices.find(voice => voice.name.toLowerCase().includes('google'));
        if (googleVoice) utterance.voice = googleVoice;
        else if (englishVoices.length > 0) utterance.voice = englishVoices[0];
      } else {
        utterance.lang = 'ko-KR';
        const koreanVoices = voices.filter(voice => voice.lang.includes('ko'));
        const googleVoice = koreanVoices.find(voice => voice.name.toLowerCase().includes('google') || voice.name.includes('구글'));
        if (googleVoice) utterance.voice = googleVoice;
        else if (koreanVoices.length > 0) utterance.voice = koreanVoices[0];
      }
      window.speechSynthesis.speak(utterance);
    }

    function openListModal(mode) {
      if (sheetData.length === 0) return;
      const modal = document.getElementById('verseListModal');
      const qSelectorContainer = document.getElementById('quarterSelectorContainer');
      const qSelector = document.getElementById('modalQuarterSelector');
      modal.classList.remove('hidden');
      
      if (mode === 'quarter') {
        document.getElementById('modalTitle').innerText = '13기억절 (분기별 보기)';
        qSelectorContainer.classList.remove('hidden');
        const currentQuarter = Math.floor(currentIndex / 13) + 1;
        const maxQuarter = Math.ceil(sheetData.length / 13) || 1;
        qSelector.innerHTML = '';
        for (let i = 1; i <= maxQuarter; i++) {
          let opt = document.createElement('option');
          opt.value = i; opt.text = `제 ${i}기 (${(i - 1) * 13 + 1}~${Math.min(i * 13, sheetData.length)}주차)`;
          if (i === currentQuarter) opt.selected = true;
          qSelector.appendChild(opt);
        }
        renderList('quarter', currentQuarter);
      } else {
        document.getElementById('modalTitle').innerText = '52기억절 (1년 보기)';
        qSelectorContainer.classList.add('hidden');
        renderList('year');
      }
    }

    function closeListModal() {
      document.getElementById('verseListModal').classList.add('hidden');
    }

    function renderList(mode, quarter = 1) {
      const container = document.getElementById('verseListContainer');
      container.innerHTML = '';
      let filteredData = (mode === 'quarter') ? 
        sheetData.slice((parseInt(quarter) - 1) * 13, (parseInt(quarter) - 1) * 13 + 13).map((item, idx) => ({...item, originalIndex: (parseInt(quarter) - 1) * 13 + idx})) : 
        sheetData.map((item, idx) => ({...item, originalIndex: idx}));
      
      if (filteredData.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-500 py-5 text-base">해당하는 데이터가 없습니다.</p>';
        return;
      }
      filteredData.forEach(item => {
        const div = document.createElement('div');
        const isCurrent = (item.originalIndex === currentIndex);
        div.className = `p-4 md:p-5 border rounded-xl cursor-pointer transition ${isCurrent ? 'bg-indigo-50 border-indigo-200 shadow-md' : 'bg-slate-50 hover:bg-slate-100 border-slate-200'}`;
        div.onclick = () => { selectWeek(item.originalIndex); closeListModal(); };
        let dObj = item.date ? new Date(item.date) : null;
        let dateStr = '';
        if(dObj && !isNaN(dObj)){
          const month = dObj.getMonth()+1;
          const date = dObj.getDate();
          dateStr = `${month}월 ${date}일`;
        }
        
        div.innerHTML = `
          <div class="flex justify-between items-center mb-1.5">
            <span class="text-xs md:text-sm font-bold ${isCurrent ? 'text-indigo-700' : 'text-indigo-500'}">${item.quarter || ((item.originalIndex + 1) + '주차')}</span>
            <span class="text-xs md:text-sm text-slate-400">${dateStr}</span>
          </div>
          <h4 class="font-bold text-slate-800 text-base md:text-lg">${item.title_ko || '제목 없음'}</h4>
          <p class="text-xs md:text-sm text-slate-400 mb-2 italic">${item.title_en || ''}</p>
          <p class="text-sm md:text-base font-semibold text-slate-500 mb-1.5"><i class="fa-solid fa-book-open text-xs mr-1"></i>${item.bible_ko || ''} <span class="font-normal text-slate-400">/ ${item.bible_en || ''}</span></p>
          <p class="text-base md:text-lg text-slate-800 leading-relaxed font-medium mt-1">"${item.verse_ko || ''}"</p>
          <p class="text-sm md:text-base text-slate-500 leading-relaxed font-light italic mt-1.5">"${item.verse_en || ''}"</p>
        `;
        container.appendChild(div);
      });
    }

    function setupSwipeEvents() {
      const swipeZone = document.getElementById('swipeZone');
      let touchStartX = 0;
      let touchEndX = 0;
      const minSwipeDistance = 50; 

      swipeZone.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
      }, {passive: true});

      swipeZone.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, {passive: true});

      let isMouseDown = false;
      swipeZone.addEventListener('mousedown', e => {
        isMouseDown = true;
        touchStartX = e.screenX;
      });
      
      swipeZone.addEventListener('mouseup', e => {
        if(isMouseDown) {
          touchEndX = e.screenX;
          isMouseDown = false;
          handleSwipe();
        }
      });

      swipeZone.addEventListener('mouseleave', () => {
        isMouseDown = false;
      });

      function handleSwipe() {
        const swipeDistance = touchEndX - touchStartX;
        if (swipeDistance > minSwipeDistance) changeWeek(-1); // 오른쪽 스와이프: 이전
        else if (swipeDistance < -minSwipeDistance) changeWeek(1); // 왼쪽 스와이프: 다음
      }
    }
  </script>
</body>
</html>
